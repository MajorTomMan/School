name: One-time visualization course migration

on:
  push:
    branches: [refactor/visualization-infrastructure]
    paths:
      - ".github/workflows/migrate-visualization-course.yml"
      - "tools/course-content/migrate_scene_visualizations.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/visualization-infrastructure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore old committed course
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visualization-migration
          cat courses/pep-math-7-1/course.json.gz.b64.part* > build/visualization-migration/course.json.gz.b64
          base64 --decode build/visualization-migration/course.json.gz.b64 > build/visualization-migration/course.json.gz
          gzip --test build/visualization-migration/course.json.gz
          gzip -dc build/visualization-migration/course.json.gz > build/visualization-migration/old-course.json

      - name: Migrate and validate visualization steps
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/course-content/migrate_scene_visualizations.py build/visualization-migration/old-course.json build/visualization-migration/course.json
          python3 tools/course-content/validate_authored_course.py build/visualization-migration/course.json
          sha256sum build/visualization-migration/course.json

      - name: Replace committed deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          source = Path('build/visualization-migration/course.json')
          target_dir = Path('courses/pep-math-7-1')
          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          compressed = gzip.compress(raw, compresslevel=9, mtime=0)
          encoded = base64.b64encode(compressed).decode('ascii')
          for old in target_dir.glob('course.json.gz.b64.part*'):
              old.unlink()
          for index, start in enumerate(range(0, len(encoded), 8000), start=1):
              (target_dir / f'course.json.gz.b64.part{index:02d}').write_text(encoded[start:start + 8000], encoding='ascii')
          print(f'MIGRATED_COURSE_SHA256={digest}')
          print(f'PART_COUNT={(len(encoded) + 7999) // 8000}')
          PY

      - name: Commit migrated bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/pep-math-7-1/course.json.gz.b64.part*
          if git diff --cached --quiet; then
            echo "Bundle already migrated."
            exit 0
          fi
          git commit -m "migrate committed course visualizations"
          git push origin HEAD:refactor/visualization-infrastructure

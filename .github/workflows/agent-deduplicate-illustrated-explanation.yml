name: Agent deduplicate illustrated explanation

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-deduplicate-illustrated-explanation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Keep one shared explanation region
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/OppositeQuantityIllustratedPanels.kt')
          text = path.read_text(encoding='utf-8')
          old = '''@Composable
          private fun IllustratedStatusLine(text: String, color: Color) {
              Text(
                  text = text,
                  modifier = Modifier.fillMaxWidth().padding(top = 2.dp),
                  color = color.copy(alpha = 0.94f),
                  fontSize = 13.sp,
                  lineHeight = 19.sp,
                  fontWeight = FontWeight.Medium,
                  textAlign = TextAlign.Center,
                  maxLines = 2,
              )
          }
          '''
          new = '''@Suppress("UNUSED_PARAMETER")
          @Composable
          private fun IllustratedStatusLine(text: String, color: Color) {
              // The shared explanation below the interactive control is the single source of narrative feedback.
          }
          '''
          if old not in text:
              raise SystemExit('illustrated status function did not match expected source')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/OppositeQuantityIllustratedPanels.kt
          git commit -m "合并具象图与课程解释区域"
          git pull --rebase origin dev
          git push origin dev

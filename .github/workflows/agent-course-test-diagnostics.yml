name: Course test diagnostics

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-course-test-diagnostics.yml"
      - "tools/course-content/**"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install course test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyMuPDF
      - name: Run course tests on PR merge snapshot
        shell: bash
        run: |
          set +e
          python3 -m py_compile tools/course-content/*.py > "$RUNNER_TEMP/course-tests.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 -m unittest discover -s tools/course-content -p 'test_*.py' -v >> "$RUNNER_TEMP/course-tests.log" 2>&1
            status=$?
          fi
          cat "$RUNNER_TEMP/course-tests.log"
          cp "$RUNNER_TEMP/course-tests.log" course-tests.log
          echo "$status" > course-tests.status
          exit 0
      - name: Upload complete diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: course-test-diagnostics
          path: |
            course-tests.log
            course-tests.status

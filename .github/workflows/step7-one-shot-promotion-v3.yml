name: Step 7 One-shot Course Verification v3

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/step7-one-shot-promotion-v3.yml

permissions:
  contents: read
  issues: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}
      COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
      EXPECTED_MASTER_SHA: 7110d3e970d5f2ae3cfd21b0ad0e8033e04c5aea
      RECEIPT_PR: '88'
    steps:
      - uses: actions/checkout@v4

      - name: Execute one-shot verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          sed -n '34,$p' .github/workflows/step7-one-shot-promotion.yml \
            | sed 's/^          //' > /tmp/step7-one-shot.sh
          bash -x /tmp/step7-one-shot.sh > /tmp/step7-wrapper.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo '## 第 7 步运维包装层失败 ❌'
              echo
              echo '```text'
              tail -n 240 /tmp/step7-wrapper.log
              echo '```'
            } > /tmp/step7-wrapper-comment.md
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${RECEIPT_PR}/comments" \
              -f "body=$(cat /tmp/step7-wrapper-comment.md)"
          fi
          exit "$code"

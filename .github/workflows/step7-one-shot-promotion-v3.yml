name: Step 7 One-shot Course Verification v3

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/step7-one-shot-promotion-v3.yml

permissions:
  contents: read

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}
      COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
      EXPECTED_MASTER_SHA: 7110d3e970d5f2ae3cfd21b0ad0e8033e04c5aea
      RECEIPT_PR: '88'
    steps:
      - uses: actions/checkout@v4

      - name: Execute one-shot verifier
        shell: bash
        run: |
          set +e
          mkdir -p build/step7-wrapper build/step7-verification
          sed -n '34,$p' .github/workflows/step7-one-shot-promotion.yml \
            | sed 's/^          //' > build/step7-wrapper/step7-one-shot.sh
          gh() {
            echo 'PR comment skipped in read-only pull_request context'
            return 0
          }
          export -f gh
          bash -x build/step7-wrapper/step7-one-shot.sh \
            > build/step7-wrapper/internal.log 2>&1
          code=$?
          echo "$code" > build/step7-wrapper/exit-code.txt
          echo '===== step7 internal log ====='
          tail -n 320 build/step7-wrapper/internal.log
          echo '===== end step7 internal log ====='
          exit "$code"

      - name: Upload one-shot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7-one-shot-diagnostics
          path: |
            build/step7-wrapper/
            build/step7-verification/
          if-no-files-found: ignore
          retention-days: 3

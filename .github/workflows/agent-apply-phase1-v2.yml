name: Agent apply phase 1 v2

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-apply-phase1-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply phase 1 safely
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/agent-phase1-display-pdf.yml \
            | sed '1d;$d;s/^          //' > /tmp/phase1.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('/tmp/phase1.py')
          script = script_path.read_text(encoding='utf-8')
          script, count = re.subn(
              r'\n# Keep the underlying course or tab composed while PDF is visible\..*?\n# Number-line visuals:',
              '\n# Number-line visuals:',
              script,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'could not remove SchoolApp block from extracted script: {count}')
          script_path.write_text(script, encoding='utf-8')
          PY
          python3 /tmp/phase1.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/majortomman/school/ui/SchoolApp.kt')
          text = path.read_text(encoding='utf-8')
          open_pattern = re.compile(
              r'    val textbookPage = openedTextbookPage\n'
              r'    if \(textbookPage != null && openedTextbook != null\) \{.*?'
              r'    AnimatedContent\(\n',
              re.S,
          )
          replacement = (
              '    val textbookPage = openedTextbookPage\n'
              '    Box(modifier = Modifier.fillMaxSize()) {\n'
              '        AnimatedContent(\n'
          )
          text, count = open_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'SchoolApp opening block mismatch: {count}')
          tail = (
              '        }\n'
              '    }\n'
              '}\n\n'
              '@Composable\n'
              'private fun CourseDataUnavailableScreen(\n'
          )
          overlay = (
              '        }\n'
              '        if (textbookPage != null && openedTextbook != null) {\n'
              '            PdfTextbookScreen(\n'
              '                pack = openedTextbook.pack,\n'
              '                initialPrintedPage = textbookPage,\n'
              '                onBack = {\n'
              '                    openedTextbookKey = null\n'
              '                    openedTextbookPage = null\n'
              '                },\n'
              '            )\n'
              '        }\n'
              '    }\n'
              '}\n\n'
              '@Composable\n'
              'private fun CourseDataUnavailableScreen(\n'
          )
          if text.count(tail) != 1:
              raise SystemExit(f'SchoolApp tail mismatch: {text.count(tail)}')
          path.write_text(text.replace(tail, overlay, 1), encoding='utf-8')
          PY
      - name: Commit phase 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app version.properties .release-notes/current.md
          git commit -m "完善显示缩放与PDF阅读体验"
          git push origin HEAD:dev

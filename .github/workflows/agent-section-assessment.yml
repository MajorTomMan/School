name: Apply section assessment redesign

on:
  push:
    branches: [agent/section-assessment-ai]
    paths:
      - "tools/agent_apply_section_assessment.py"
      - "tools/agent_fix_transform.py"
      - ".github/workflows/agent-section-assessment.yml"
  pull_request:
    branches: [master]
    paths:
      - "tools/agent_apply_section_assessment.py"
      - "tools/agent_fix_transform.py"
      - ".github/workflows/agent-section-assessment.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-assessment-ai
          fetch-depth: 0
      - name: Apply repository changes
        id: apply
        shell: bash
        run: |
          set +e
          python tools/agent_fix_transform.py > "$RUNNER_TEMP/agent-apply.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python tools/agent_apply_section_assessment.py >> "$RUNNER_TEMP/agent-apply.log" 2>&1
            status=$?
          fi
          cat "$RUNNER_TEMP/agent-apply.log"
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp "$RUNNER_TEMP/agent-apply.log" tools/agent_last_error.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            rm -f tools/agent_last_error.txt
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated changes or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          if [ "${{ steps.apply.outputs.failed }}" = "true" ]; then
            git commit -m "记录课程重构脚本错误"
          else
            git commit -m "重构小节练习与AI判题流程"
          fi
          git push origin HEAD:agent/section-assessment-ai

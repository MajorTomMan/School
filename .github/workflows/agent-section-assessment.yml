name: Apply section assessment redesign

on:
  push:
    branches: [agent/section-assessment-ai]
    paths:
      - "tools/agent_apply_section_assessment.py"
      - ".github/workflows/agent-section-assessment.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-assessment-ai
          fetch-depth: 0
      - name: Apply repository changes
        run: python tools/agent_apply_section_assessment.py
      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "重构小节练习与AI判题流程"
          git push origin HEAD:agent/section-assessment-ai

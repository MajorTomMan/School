name: One-shot textbook course rewrite

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/one-shot-textbook-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Rewrite current authored course
        run: |
          python3 .github/one-shot/rewrite_textbook_course.py
          python3 -m json.tool courses/pep-math-7-1/course.json >/dev/null

      - name: Commit rewritten course and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-textbook-rewrite.yml .github/one-shot/rewrite_textbook_course.py
          git add courses/pep-math-7-1/course.json
          git commit -m "course: rebuild textbook lesson flow"
          git push origin HEAD:dev

name: Agent trigger phase 1

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-trigger-phase1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Run phase 1 patch script
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/agent-phase1-display-pdf.yml \
            | sed '1d;$d;s/^          //' > /tmp/phase1.py
          python3 /tmp/phase1.py
      - name: Commit phase 1 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app version.properties .release-notes/current.md
          git commit -m "完善显示缩放与PDF阅读体验"
          git push origin HEAD:dev

name: Agent AI default endpoint

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-ai-default-endpoint.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove implicit LAN AI endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/data/PreferencesRepository.kt')
          text = path.read_text(encoding='utf-8')
          old = '    val endpoint: String = "http://192.168.1.2:7777/v1",\n'
          new = '    val endpoint: String = "",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one default endpoint, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit default AI configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/data/PreferencesRepository.kt
          git commit -m "默认不配置AI接口地址"
          git push origin HEAD:dev

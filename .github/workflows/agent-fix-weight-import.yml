name: Agent fix weight import

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-fix-weight-import.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove internal weight import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/OppositeQuantityAxisPanel.kt')
          text = path.read_text(encoding='utf-8')
          old = 'import androidx.compose.foundation.layout.weight\n'
          if old not in text:
              raise SystemExit('weight import not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/OppositeQuantityAxisPanel.kt
          git commit -m "fix(ui): remove internal weight import"
          git pull --rebase origin dev
          git push origin dev

name: Agent fix course color import

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-fix-course-color-import.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore required Color import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/CloudCourseLessonScreen.kt')
          text = path.read_text(encoding='utf-8')
          marker = 'import androidx.compose.ui.graphics.graphicsLayer\n'
          required = 'import androidx.compose.ui.graphics.Color\n'
          if required not in text:
              if marker not in text:
                  raise SystemExit('graphics import marker missing')
              text = text.replace(marker, required + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/CloudCourseLessonScreen.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "恢复课程文字操作所需颜色导入"
          git pull --rebase origin dev
          git push origin dev

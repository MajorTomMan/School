name: Agent reset AI failure count

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-reset-ai-failure-count.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Reset technical failure count after valid response
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/AssessmentAiJudgeSection.kt')
          text = path.read_text(encoding='utf-8')
          old = '''                            } else {
                                evaluation = result
                                if (result.answerCorrect) {
'''
          new = '''                            } else {
                                aiFailureCount = 0
                                evaluation = result
                                if (result.answerCorrect) {
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one valid AI response branch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit AI counter behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/AssessmentAiJudgeSection.kt
          git commit -m "AI成功响应后重置技术失败计数"
          git push origin HEAD:dev

name: R2 Storage Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "课程存储/R2 操作"
        required: true
        default: list
        type: choice
        options:
          - list
          - read
          - create
          - update
          - delete
          - dir-list
          - dir-read
          - dir-create
          - dir-update
          - dir-delete
          - purge
          - release-upload
          - publish
      backend:
        description: "普通 CRUD 后端；worker 为默认课程存储，direct 仅用于底层 R2 恢复"
        required: true
        default: worker
        type: choice
        options:
          - worker
          - direct
      target:
        description: "对象 key 或目录 prefix；list 留空表示当前后端可见范围"
        required: false
        default: ""
        type: string
      source_url:
        description: "create/update 的源文件 URL；目录/release 操作时必须是 ZIP。不要填写长期凭据 URL"
        required: false
        default: ""
        type: string
      release_id:
        description: "release-upload/publish 使用的 immutable release ID"
        required: false
        default: ""
        type: string
      channel:
        description: "release-upload/publish 的目标 channel"
        required: false
        default: none
        type: choice
        options:
          - none
          - testing
          - stable
      recursive:
        description: "dir-list 是否递归列出"
        required: false
        default: true
        type: boolean
      delete_extra:
        description: "dir-update 时删除远端不存在于源 ZIP 的多余文件"
        required: false
        default: false
        type: boolean
      allow_release_mutation:
        description: "允许 update/delete immutable releases/；purge 必须显式开启"
        required: false
        default: false
        type: boolean
      confirm_destructive:
        description: "delete/dir-delete/purge 必须显式确认"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: r2-storage-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    env:
      COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}
      COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install direct R2 dependency
        if: inputs.backend == 'direct'
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Run R2 action
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          BACKEND: ${{ inputs.backend }}
          TARGET: ${{ inputs.target }}
          SOURCE_URL: ${{ inputs.source_url }}
          RELEASE_ID: ${{ inputs.release_id }}
          CHANNEL: ${{ inputs.channel }}
          RECURSIVE: ${{ inputs.recursive }}
          DELETE_EXTRA: ${{ inputs.delete_extra }}
          ALLOW_RELEASE_MUTATION: ${{ inputs.allow_release_mutation }}
          CONFIRM_DESTRUCTIVE: ${{ inputs.confirm_destructive }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/r2-input build/r2-output

          require_target() {
            [ -n "${TARGET:-}" ] || { echo "${ACTION} 必须填写 target" >&2; exit 1; }
          }

          require_release_id() {
            [ -n "${RELEASE_ID:-}" ] || { echo "${ACTION} 必须填写 release_id" >&2; exit 1; }
          }

          require_source_url() {
            [ -n "${SOURCE_URL:-}" ] || { echo "${ACTION} 必须填写 source_url" >&2; exit 1; }
            case "$SOURCE_URL" in
              http://*|https://*) ;;
              *) echo "source_url 只接受 http:// 或 https://" >&2; exit 1 ;;
            esac
          }

          require_destructive_confirmation() {
            [ "$CONFIRM_DESTRUCTIVE" = "true" ] || { echo "${ACTION} 是删除操作，必须勾选 confirm_destructive" >&2; exit 1; }
          }

          require_course_config() {
            [ -n "${COURSE_API_TOKEN:-}" ] || { echo "缺少 GitHub Actions Secret: COURSE_API_TOKEN" >&2; exit 1; }
            [ -n "${COURSE_BASE_URL:-}" ] || { echo "缺少 COURSE_BASE_URL" >&2; exit 1; }
          }

          require_r2_config() {
            missing=()
            [ -n "${R2_ACCOUNT_ID:-}" ] || missing+=(R2_ACCOUNT_ID)
            [ -n "${R2_ACCESS_KEY_ID:-}" ] || missing+=(R2_ACCESS_KEY_ID)
            [ -n "${R2_BUCKET_NAME:-}" ] || missing+=(R2_BUCKET_NAME)
            [ -n "${R2_SECRET_ACCESS_KEY:-}" ] || missing+=(R2_SECRET_ACCESS_KEY)
            if [ "${#missing[@]}" -ne 0 ]; then
              printf '缺少 direct R2 配置：%s\n' "${missing[*]}" >&2
              exit 1
            fi
          }

          require_storage_config() {
            if [ "$BACKEND" = "worker" ]; then require_course_config; else require_r2_config; fi
          }

          storage_flags=(--backend "$BACKEND")
          release_flags=()
          if [ "$ALLOW_RELEASE_MUTATION" = "true" ]; then release_flags+=(--allow-release-mutation); fi

          download_object_source() {
            require_source_url
            local name="${TARGET##*/}"
            [ -n "$name" ] || name="object.bin"
            local output="build/r2-input/$name"
            curl --fail --location --retry 4 --retry-delay 2 --silent --show-error --output "$output" "$SOURCE_URL"
            printf '%s\n' "$output"
          }

          extract_zip_source() {
            require_source_url
            local archive="build/r2-input/source.zip"
            local output="build/r2-input/source"
            curl --fail --location --retry 4 --retry-delay 2 --silent --show-error --output "$archive" "$SOURCE_URL"
            rm -rf "$output"
            mkdir -p "$output"
            python3 - "$archive" "$output" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              for item in source.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"ZIP 包含不安全路径：{item.filename}")
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"ZIP 不允许符号链接：{item.filename}")
              source.extractall(output)
          PY
            printf '%s\n' "$output"
          }

          resolve_release_root() {
            local root="$1"
            if [ -f "$root/manifest.json" ]; then
              printf '%s\n' "$root"
              return
            fi
            mapfile -t manifests < <(find "$root" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print)
            if [ "${#manifests[@]}" -eq 1 ]; then
              dirname "${manifests[0]}"
              return
            fi
            echo "release ZIP 根目录或唯一一级子目录必须包含 manifest.json" >&2
            exit 1
          }

          case "$ACTION" in
            release-upload)
              require_course_config
              require_release_id
              [ "$CHANNEL" != "stable" ] || { echo "release-upload 不允许直接发布 stable；先上传到 none/testing，再使用 publish 提升 stable" >&2; exit 1; }
              source_dir="$(extract_zip_source)"
              release_root="$(resolve_release_root "$source_dir")"
              python3 scripts/course_r2_manager.py release-upload --root "$release_root" --release-id "$RELEASE_ID" --channel "$CHANNEL" | tee build/r2-output/result.txt
              ;;
            publish)
              require_course_config
              require_release_id
              [ "$CHANNEL" != "none" ] || { echo "publish 的 channel 必须是 testing 或 stable" >&2; exit 1; }
              python3 scripts/course_r2_manager.py publish --release-id "$RELEASE_ID" --channel "$CHANNEL" | tee build/r2-output/result.txt
              ;;
            list)
              require_storage_config
              python3 scripts/course_r2_manager.py list "${TARGET:-}" --json "${storage_flags[@]}" | tee build/r2-output/list.json
              ;;
            read)
              require_storage_config
              require_target
              output="build/r2-output/${TARGET##*/}"
              python3 scripts/course_r2_manager.py read "$TARGET" --output "$output" --force "${storage_flags[@]}" | tee build/r2-output/result.txt
              ;;
            create)
              require_storage_config
              require_target
              source_file="$(download_object_source)"
              python3 scripts/course_r2_manager.py create "$source_file" "$TARGET" "${storage_flags[@]}" | tee build/r2-output/result.txt
              ;;
            update)
              require_storage_config
              require_target
              source_file="$(download_object_source)"
              python3 scripts/course_r2_manager.py update "$source_file" "$TARGET" "${storage_flags[@]}" "${release_flags[@]}" | tee build/r2-output/result.txt
              ;;
            delete)
              require_storage_config
              require_target
              require_destructive_confirmation
              python3 scripts/course_r2_manager.py delete "$TARGET" --yes "${storage_flags[@]}" "${release_flags[@]}" | tee build/r2-output/result.txt
              ;;
            dir-list)
              require_storage_config
              require_target
              args=(dir-read "$TARGET" --json "${storage_flags[@]}")
              if [ "$RECURSIVE" = "true" ]; then args+=(--recursive); fi
              python3 scripts/course_r2_manager.py "${args[@]}" | tee build/r2-output/list.json
              ;;
            dir-read)
              require_storage_config
              require_target
              python3 scripts/course_r2_manager.py dir-read "$TARGET" --output build/r2-output/directory --force "${storage_flags[@]}" | tee build/r2-output/result.txt
              ;;
            dir-create)
              require_storage_config
              require_target
              if [ -n "${SOURCE_URL:-}" ]; then
                source_dir="$(extract_zip_source)"
                python3 scripts/course_r2_manager.py dir-create "$TARGET" --from "$source_dir" "${storage_flags[@]}" | tee build/r2-output/result.txt
              else
                python3 scripts/course_r2_manager.py dir-create "$TARGET" "${storage_flags[@]}" | tee build/r2-output/result.txt
              fi
              ;;
            dir-update)
              require_storage_config
              require_target
              source_dir="$(extract_zip_source)"
              args=(dir-update "$source_dir" "$TARGET" "${storage_flags[@]}")
              if [ "$DELETE_EXTRA" = "true" ]; then args+=(--delete-extra); fi
              args+=("${release_flags[@]}")
              python3 scripts/course_r2_manager.py "${args[@]}" | tee build/r2-output/result.txt
              ;;
            dir-delete)
              require_storage_config
              require_target
              require_destructive_confirmation
              python3 scripts/course_r2_manager.py dir-delete "$TARGET" --yes "${storage_flags[@]}" "${release_flags[@]}" | tee build/r2-output/result.txt
              ;;
            purge)
              [ "$BACKEND" = "worker" ] || { echo "purge 只允许 worker backend，防止误清共享 bucket" >&2; exit 1; }
              require_course_config
              require_destructive_confirmation
              [ "$ALLOW_RELEASE_MUTATION" = "true" ] || { echo "purge 必须同时勾选 allow_release_mutation" >&2; exit 1; }
              python3 scripts/course_r2_manager.py purge --yes --allow-release-mutation --backend worker | tee build/r2-output/result.txt
              ;;
            *)
              echo "不支持的 action：$ACTION" >&2
              exit 1
              ;;
          esac

          {
            echo "### R2 Storage Manager"
            echo "- Action: \`$ACTION\`"
            if [ "$ACTION" != "release-upload" ] && [ "$ACTION" != "publish" ]; then echo "- Backend: \`$BACKEND\`"; fi
            if [ -n "${RELEASE_ID:-}" ]; then echo "- Release: \`$RELEASE_ID\`"; fi
            if [ -n "${TARGET:-}" ]; then echo "- Target: \`$TARGET\`"; fi
            if [ "$ACTION" = "release-upload" ] || [ "$ACTION" = "publish" ]; then echo "- Channel: \`$CHANNEL\`"; fi
            echo "- Run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-manager-${{ github.run_id }}
          path: build/r2-output/
          if-no-files-found: ignore
          retention-days: 7

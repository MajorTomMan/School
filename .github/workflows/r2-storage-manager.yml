name: R2 Storage Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "课程存储/R2 操作"
        required: true
        default: list
        type: choice
        options:
          - list
          - read
          - create
          - update
          - delete
          - dir-list
          - dir-read
          - dir-create
          - dir-update
          - dir-delete
          - purge
          - release-upload
          - publish
      backend:
        description: "普通 CRUD 后端；worker 为默认课程存储，direct 仅用于底层 R2 恢复"
        required: true
        default: worker
        type: choice
        options:
          - worker
          - direct
      target:
        description: "对象 key 或目录 prefix；list 留空表示当前后端可见范围"
        required: false
        default: ""
        type: string
      source_url:
        description: "create/update 的源文件 URL；目录/release 操作时必须是 ZIP。不要填写长期凭据 URL"
        required: false
        default: ""
        type: string
      release_id:
        description: "release-upload/publish 使用的 immutable release ID"
        required: false
        default: ""
        type: string
      channel:
        description: "release-upload/publish 的目标 channel"
        required: false
        default: none
        type: choice
        options:
          - none
          - testing
          - stable
      recursive:
        description: "dir-list 是否递归列出"
        required: false
        default: true
        type: boolean
      delete_extra:
        description: "dir-update 时删除远端不存在于源 ZIP 的多余文件"
        required: false
        default: false
        type: boolean
      allow_release_mutation:
        description: "允许 update/delete immutable releases/；purge 必须显式开启"
        required: false
        default: false
        type: boolean
      confirm_destructive:
        description: "delete/dir-delete/purge 必须显式确认"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: r2-storage-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    env:
      COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}
      COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run R2 action
        run: python3 scripts/course_r2_ci.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-manager-${{ github.run_id }}
          path: build/r2-output/
          if-no-files-found: ignore
          retention-days: 7

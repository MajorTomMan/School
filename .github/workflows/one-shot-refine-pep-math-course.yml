name: One-shot PEP Math Textbook Refinement

on:
  push:
    branches:
      - course/rebuild-pep-math-7-1
    paths:
      - ".github/workflows/one-shot-refine-pep-math-course.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: course/rebuild-pep-math-7-1

      - name: Apply textbook-aligned content refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('courses/pep-math-7-1/course.json')
          course = json.loads(path.read_text(encoding='utf-8'))

          def find_lesson(lesson_id):
              for chapter in course['chapters']:
                  for section in chapter['sections']:
                      for lesson in section['lessons']:
                          if lesson['id'] == lesson_id:
                              return lesson
              raise KeyError(lesson_id)

          def find_section(section_id):
              for chapter in course['chapters']:
                  for section in chapter['sections']:
                      if section['id'] == section_id:
                          return section
              raise KeyError(section_id)

          def add_kp_after(after_id, item):
              ids = [kp['id'] for kp in course['knowledgePoints']]
              if item['id'] in ids:
                  raise SystemExit(f"knowledge point already exists: {item['id']}")
              index = ids.index(after_id) + 1
              course['knowledgePoints'].insert(index, item)

          def insert_lesson_after(section_id, after_id, lesson):
              section = find_section(section_id)
              ids = [item['id'] for item in section['lessons']]
              if lesson['id'] in ids:
                  raise SystemExit(f"lesson already exists: {lesson['id']}")
              index = ids.index(after_id) + 1
              section['lessons'].insert(index, lesson)

          # 教材术语：2024版使用“准确数”。
          def replace_strings(value):
              if isinstance(value, str):
                  return value.replace('精确数', '准确数')
              if isinstance(value, list):
                  return [replace_strings(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace_strings(item) for key, item in value.items()}
              return value

          course = replace_strings(course)

          # 第二章：补齐教材小标题 2.3.3。
          approximation = find_lesson('ch02-approximation')
          approximation['title'] = '2.3.3 近似数'
          approximation['aliases'] = ['近似数', '准确数与近似数', '四舍五入']

          # 第三章：补回教材在3.1中的正比例、反比例主线。
          add_kp_after('quantity-relation', {
              'id': 'direct-proportion',
              'name': '正比例关系',
              'description': '理解两个相关联的量在工作效率等条件保持不变时，比值保持一定所体现的正比例关系。',
              'prerequisiteIds': ['quantity-relation'],
          })
          add_kp_after('direct-proportion', {
              'id': 'inverse-proportion',
              'name': '反比例关系',
              'description': '理解两个相关联的量在总量保持不变时，乘积保持一定所体现的反比例关系。',
              'prerequisiteIds': ['direct-proportion'],
          })

          ch03_intro = find_lesson('ch03-intro')
          ch03_intro['goals'] = [
              '从采摘机器人识别范围与工作时间的关系中体会用字母表示一般数量关系',
              '了解本章将研究代数式、正比例与反比例以及代数式的值',
          ]
          ch03_intro['steps'] = [
              {
                  'type': 'question',
                  'prompt': '某采摘机器人1 s能识别5 m²的范围。如果工作t s，怎样用一个式子表示它能识别的范围？',
                  'hint': '先写出“工作效率×工作时间=工作量”。',
              },
              {
                  'type': 'explanation',
                  'title': '从具体数到一般数量关系',
                  'text': '当工作时间不断变化时，逐个代入具体数字并不方便。用字母表示变化的数量，就能用一个式子概括一类问题，并进一步研究两个相关联的量怎样变化。',
              },
              {
                  'type': 'summary',
                  'text': '本章先用代数式表示数量和数量关系，再由工程问题认识正比例、反比例，最后学习给字母取值时怎样求代数式的值。',
              },
          ]

          algebraic = find_lesson('ch03-algebraic-expression')
          algebraic['steps'].insert(1, {
              'type': 'keyIdea',
              'title': '代数式',
              'text': '用运算符号把数或表示数的字母连接起来得到的式子叫作代数式；单独一个数或一个字母也可以看作代数式。',
          })

          insert_lesson_after('section-03-01', 'ch03-expression-meaning', {
              'id': 'ch03-direct-proportion',
              'title': '正比例关系',
              'aliases': ['成正比例的量', '正比例'],
              'goals': ['从工作效率一定的工程问题中识别正比例关系', '用比值是否保持一定解释两个量为什么成正比例'],
              'knowledgePointIds': ['quantity-relation', 'direct-proportion'],
              'prerequisiteLessonIds': ['ch03-expression-meaning'],
              'references': [{'label': '教材第72—73页', 'pageStart': 72, 'pageEnd': 73}],
              'steps': [
                  {
                      'type': 'question',
                      'prompt': '采摘机器人每秒识别5 m²，工作t s时识别5t m²。识别范围与工作时间的比值怎样变化？',
                      'hint': '分别用“识别范围÷工作时间”计算几组数据。',
                  },
                  {
                      'type': 'keyIdea',
                      'title': '工作效率一定时的正比例关系',
                      'text': '在工程问题中，工作效率保持不变时，工作量随着工作时间变化，而且工作量与工作时间的比值保持不变。这样的两个量成正比例关系。',
                  },
                  {
                      'type': 'example',
                      'title': '例：判断正比例',
                      'prompt': '一台设备每分钟加工12个零件。加工数量与工作时间是否成正比例？',
                      'steps': ['设工作t min，加工数量为12t。', '加工数量与时间的比值始终为12。', '比值保持不变，因此两者成正比例。'],
                      'answer': '成正比例',
                  },
                  {
                      'type': 'checkpoint',
                      'prompt': '路程一定时，速度与时间还成正比例吗？',
                      'expectedAnswer': '不成正比例',
                      'explanation': '路程一定时，速度与时间的乘积保持不变，应从反比例关系继续研究。',
                  },
              ],
              'practice': [
                  {
                      'id': 'ch03-p06',
                      'prompt': '某水管每分钟流出8 L水。流出的水量与时间是否成正比例？为什么？',
                      'answer': '成正比例；水量与时间的比值始终为8 L/min',
                      'analysis': ['设时间为t min，水量为8t L。', '8t÷t=8，工作效率保持不变。'],
                      'knowledgePointIds': ['direct-proportion'],
                      'difficulty': 2,
                  }
              ],
              'summary': ['判断正比例不能只看“一个量增大另一个量也增大”，还要看相对应数值的比值是否保持一定。'],
          })

          insert_lesson_after('section-03-01', 'ch03-direct-proportion', {
              'id': 'ch03-inverse-proportion',
              'title': '反比例关系',
              'aliases': ['成反比例的量', '反比例'],
              'goals': ['从工作总量一定的工程问题中识别反比例关系', '用乘积是否保持一定解释两个量为什么成反比例'],
              'knowledgePointIds': ['quantity-relation', 'inverse-proportion'],
              'prerequisiteLessonIds': ['ch03-direct-proportion'],
              'references': [{'label': '教材第73—75页', 'pageStart': 73, 'pageEnd': 75}],
              'steps': [
                  {
                      'type': 'question',
                      'prompt': '某赛场计划完成260000 m³的造雪量。每天造雪5000 m³、5200 m³、6500 m³时，所需天数分别怎样变化？',
                      'hint': '先分别计算“每天造雪量×造雪天数”。',
                  },
                  {
                      'type': 'keyIdea',
                      'title': '反比例关系',
                      'text': '两个相关联的量，一个量变化时另一个量也随之变化；如果相对应的两个数的乘积保持一定，这两个量成反比例关系。用x、y表示两个量时，可以用xy=k表示，其中k为确定的非零数。',
                  },
                  {
                      'type': 'example',
                      'title': '例：固定体积中的底面积和高',
                      'prompt': '圆柱中水的体积固定为300 cm³，底面积为x cm²、水高为y cm。x与y满足什么关系？',
                      'steps': ['圆柱体积=底面积×高。', '体积固定为300，所以xy=300。', 'x与y的乘积保持不变，因此两者成反比例。'],
                      'answer': 'xy=300，x与y成反比例',
                  },
                  {
                      'type': 'checkpoint',
                      'prompt': '总价一定时，商品单价与购买数量通常是什么关系？',
                      'expectedAnswer': '反比例关系',
                      'explanation': '单价×数量=总价，总价保持不变。',
                  },
              ],
              'practice': [
                  {
                      'id': 'ch03-p07',
                      'prompt': '汽车行驶路程固定为180 km。平均速度与行驶时间是否成反比例？为什么？',
                      'answer': '成反比例；速度×时间始终为180 km',
                      'analysis': ['路程=速度×时间。', '路程固定时，相对应的速度与时间乘积保持180。'],
                      'knowledgePointIds': ['inverse-proportion'],
                      'difficulty': 2,
                  }
              ],
              'summary': ['判断反比例要看两个相关联的量的乘积是否保持一定，而不是只看一个增大、另一个减小。'],
          })

          find_lesson('ch03-number-letter-dialogue')['prerequisiteLessonIds'] = ['ch03-inverse-proportion']
          ch03_summary = find_lesson('ch03-summary')
          ch03_summary['knowledgePointIds'] = ['letters-as-numbers', 'algebraic-expression', 'quantity-relation', 'direct-proportion', 'inverse-proportion', 'expression-value']
          ch03_summary['steps'][0]['text'] = '用字母表示数，使一个式子能够表达一般数量关系；列代数式要分析运算结构并按规范书写；两个相关联的量还可以通过比值或乘积是否保持一定来研究正比例、反比例关系；当字母取确定值时，再把数代入原式求值。'

          # 第四章引言回到教材的桥梁工程语境。
          ch04_intro = find_lesson('ch04-intro')
          ch04_intro['steps'] = [
              {
                  'type': 'question',
                  'prompt': '大型桥梁工程中，桥长、隧道长、钢缆平均长度等量常用字母表示。由这些量列出的式子，有的只是数与字母的积，有的是若干这样的式子的和。它们怎样分类，又怎样进行加减运算？',
                  'hint': '先观察每个式子由多少个“项”组成。',
              },
              {
                  'type': 'explanation',
                  'title': '从实际数量关系到整式',
                  'text': '代数式可以把复杂工程中的数量关系写得简明。本章选取其中结构最基本的一类——整式，研究单项式、多项式以及整式的加法与减法。',
              },
              {'type': 'summary', 'text': '先认识整式的结构，再利用分配律研究合并同类项、去括号和整式加减。'},
          ]

          # 第五章引言使用教材的追及问题，并补足等式的两个基本事实。
          ch05_intro = find_lesson('ch05-intro')
          ch05_intro['steps'] = [
              {
                  'type': 'question',
                  'prompt': '一辆客车以60 km/h从甲地驶向乙地，过一段时间后，一辆轿车以70 km/h从甲地沿同一路线追赶。怎样用未知数和相等关系表示“轿车追上客车”这一时刻？',
                  'hint': '追上时，两车从甲地出发后行驶的路程相等。',
              },
              {
                  'type': 'explanation',
                  'title': '把未知量写进相等关系',
                  'text': '实际问题中有些未知量不能直接算出，但可以先用字母表示，再根据“路程相等”“部分量之和等于总量”等相等关系列出方程。',
              },
              {'type': 'summary', 'text': '本章从实际问题中的相等关系出发认识方程，学习等式性质和一元一次方程的解法，再回到实际问题完成建模与解释。'},
          ]

          equality = find_lesson('ch05-equality-properties')
          equality['title'] = '5.1.2 等式的性质'
          equality['steps'].insert(0, {
              'type': 'keyIdea',
              'title': '等式的两个基本事实',
              'text': '等式两边可以交换位置；如果两个数或式都等于同一个数或式，那么这两个数或式相等。后者体现了相等关系的传递性。',
          })

          # 第六章：补足几何抽象、线段最短/两点间距离、尺规作等长线段、余角和补角。
          add_kp_after('segment-comparison-midpoint', {
              'id': 'two-point-distance',
              'name': '两点之间线段最短与两点间距离',
              'description': '理解两点之间线段最短，并把连接两点的线段长度作为两点间距离。',
              'prerequisiteIds': ['segment-comparison-midpoint'],
          })
          add_kp_after('angle-operation', {
              'id': 'complementary-supplementary-angle',
              'name': '余角和补角',
              'description': '理解两个角的和为90°时互为余角、和为180°时互为补角，并掌握同角或等角的余角、补角相等。',
              'prerequisiteIds': ['angle-operation'],
          })

          ch06_intro = find_lesson('ch06-intro')
          ch06_intro['steps'] = [
              {
                  'type': 'question',
                  'prompt': '画五角星、设计包装盒时，我们真正关心的是物体的哪些特征？如果忽略材质和颜色，只研究形状、大小和位置关系，会得到什么数学对象？',
                  'hint': '把现实物体中与当前问题有关的形状抽取出来。',
              },
              {
                  'type': 'keyIdea',
                  'title': '几何图形',
                  'text': '从物体的外形中抽取出来的各种图形统称几何图形。几何主要研究图形的形状、大小和位置关系。',
              },
              {
                  'type': 'visualization',
                  'renderer': 'mathematics.geometry.object-abstraction',
                  'parameters': {},
                  'texts': {'title': '从物体外形抽象几何图形', 'labelA': '物体', 'labelB': '形状', 'labelC': '大小', 'labelD': '位置关系', 'note': '忽略与当前几何问题无关的属性。'},
              },
              {'type': 'summary', 'text': '本章从立体图形和平面图形开始，再研究直线、射线、线段和角，并通过度量、作图和数量关系加深对图形的认识。'},
          ]

          segment = find_lesson('ch06-segment-comparison')
          segment['knowledgePointIds'] = ['segment-comparison-midpoint', 'two-point-distance']
          segment['goals'] = ['用度量、叠合或尺规作图比较线段长短', '理解线段中点以及“两点之间线段最短”和两点间距离']
          segment['steps'].insert(1, {
              'type': 'explanation',
              'title': '作一条线段等于已知线段',
              'text': '除了用刻度尺量出长度再作图，还可以只用无刻度直尺和圆规截取一条等于已知线段的线段。这类只限定使用无刻度直尺和圆规的作图称为尺规作图。',
          })
          segment['steps'].insert(-1, {
              'type': 'keyIdea',
              'title': '两点之间线段最短',
              'text': '连接两点的所有路径中，线段最短。连接两点的线段的长度叫作这两点间的距离。',
          })
          segment['practice'].append({
              'id': 'ch06-p10',
              'prompt': '从A地到B地有一条直路和一条弯路。如果只比较路程长短，为什么直路更短？',
              'answer': '因为两点之间线段最短',
              'analysis': ['把A、B看作两个点。', '连接A、B的直路可抽象成线段，其他弯曲路线不是线段。'],
              'knowledgePointIds': ['two-point-distance'],
              'difficulty': 1,
          })

          insert_lesson_after('section-06-03', 'ch06-angle-bisector', {
              'id': 'ch06-complementary-supplementary',
              'title': '6.3.3 余角和补角',
              'aliases': ['余角', '补角'],
              'goals': ['理解余角和补角的定义', '掌握同角或等角的余角相等、补角相等并用于简单推理'],
              'knowledgePointIds': ['complementary-supplementary-angle'],
              'prerequisiteLessonIds': ['ch06-angle-bisector'],
              'references': [{'label': '教材第176—179页', 'pageStart': 176, 'pageEnd': 179}],
              'steps': [
                  {
                      'type': 'keyIdea',
                      'title': '余角与补角',
                      'text': '如果两个角的和等于90°，就说这两个角互为余角；如果两个角的和等于180°，就说这两个角互为补角。互余或互补描述的是两个角之间的数量关系。',
                  },
                  {
                      'type': 'example',
                      'title': '例：求余角和补角',
                      'prompt': '一个角为35°，它的余角和补角分别是多少？',
                      'steps': ['余角为90°-35°=55°。', '补角为180°-35°=145°。'],
                      'answer': '余角55°，补角145°',
                  },
                  {
                      'type': 'keyIdea',
                      'title': '余角、补角的基本性质',
                      'text': '同一个角的余角相等；同一个角的补角相等。进一步，如果两个角相等，那么它们的余角相等、补角也相等。',
                  },
                  {
                      'type': 'checkpoint',
                      'prompt': '∠1与∠2都和∠3互补，那么∠1与∠2有什么关系？',
                      'expectedAnswer': '∠1=∠2',
                      'explanation': '同一个角的补角相等。',
                  },
              ],
              'practice': [
                  {
                      'id': 'ch06-p11',
                      'prompt': '一个角的余角是28°，这个角是多少度？它的补角是多少度？',
                      'answer': '这个角62°，补角118°',
                      'analysis': ['原角=90°-28°=62°。', '补角=180°-62°=118°。'],
                      'knowledgePointIds': ['complementary-supplementary-angle'],
                      'difficulty': 2,
                  }
              ],
              'summary': ['判断余角、补角先看两个角的和是否分别为90°、180°，不要由图形看起来的位置直接下结论。'],
          })

          find_lesson('ch06-angle-measure-history')['prerequisiteLessonIds'] = ['ch06-complementary-supplementary']
          ch06_summary = find_lesson('ch06-summary')
          ch06_summary['knowledgePointIds'] = ['solid-plane-figure', 'point-line-surface-body', 'line-ray-segment', 'segment-comparison-midpoint', 'two-point-distance', 'angle', 'angle-measure', 'angle-operation', 'angle-bisector', 'complementary-supplementary-angle']
          ch06_summary['steps'][0]['text'] = '几何从现实物体抽象出立体图形和平面图形，并可从点、线、面、体的关系认识图形结构；直线、射线、线段具有不同的端点和延伸性质，两点之间线段最短，线段长度给出两点间距离；研究角时可以类比线段的方法比较、运算和平分，并进一步研究余角和补角。'

          path.write_text(json.dumps(course, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 tools/course-content/validate_authored_course.py courses/pep-math-7-1/course.json
          python3 tools/course-content/validate_pep_math_7_1_editorial.py courses/pep-math-7-1/course.json

      - name: Commit refined course
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add courses/pep-math-7-1/course.json
          git commit -m "course: restore textbook proportion and geometry concepts"
          git push origin HEAD:course/rebuild-pep-math-7-1

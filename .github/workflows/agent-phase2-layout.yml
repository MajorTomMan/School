name: Agent phase 2 grading layout

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-phase2-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove duplicate bottom local judging button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/AssessmentSessionScreen.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        AssessmentOutlineAction(
            label = if (page.progress.answerLocked) "本题已完成" else "提交答案（本地判题）",
            enabled = page.canSubmit,
            modifier = Modifier.fillMaxWidth(),
            color = InteractiveBlue,
        ) { dispatch(AssessmentIntent.SubmitAnswer) }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one bottom judge action, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit layout update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/AssessmentSessionScreen.kt
          git commit -m "将AI判题与本地判题并排显示"
          git push origin HEAD:dev

name: Patch learning scene parser

on:
  push:
    branches: [agent/section-assessment-ai]
    paths:
      - ".github/workflows/agent-patch-learning-parser.yml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-patch-learning-parser.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-assessment-ai
          fetch-depth: 0
      - name: Allow opposite-number scenes in APK parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/majortomman/school/learning/assessment/contract/LearningContentParser.kt')
          text = path.read_text(encoding='utf-8')
          old = 'optionalString("mode", setOf("road", "construction", "value", "example", "read_points"))'
          new = 'optionalString("mode", setOf("road", "construction", "value", "example", "read_points", "opposite", "opposite_symbol"))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one APK number-line mode whitelist, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit parser update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/learning/assessment/contract/LearningContentParser.kt
          git commit -m "支持相反数题目场景解析"
          git pull --rebase origin agent/section-assessment-ai
          git push origin HEAD:agent/section-assessment-ai

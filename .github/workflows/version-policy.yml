name: Version Policy

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "signing/**"
      - "scripts/send_update_fcm.py"
      - "version.properties"
      - ".github/workflows/android.yml"
      - ".github/workflows/version-policy.yml"

permissions:
  contents: read

jobs:
  require-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump for every APK update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess

          VERSION_FILE = "version.properties"
          SEMVER = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          RELEVANT_PREFIXES = (
              "app/",
              "gradle/",
              "signing/",
          )
          RELEVANT_FILES = {
              "build.gradle.kts",
              "settings.gradle.kts",
              "gradle.properties",
              "gradlew",
              "gradlew.bat",
              "scripts/send_update_fcm.py",
              ".github/workflows/android.yml",
              ".github/workflows/version-policy.yml",
              VERSION_FILE,
          }

          def parse_properties(text: str, source: str) -> tuple[tuple[int, int, int], int, str]:
              values: dict[str, str] = {}
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "=" not in line:
                      raise SystemExit(f"{source} 含有无效行：{raw}")
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()

              name = values.get("VERSION_NAME", "")
              match = SEMVER.fullmatch(name)
              if not match:
                  raise SystemExit(f"{source} 的 VERSION_NAME 必须使用 x.y.z 格式，实际为：{name!r}")

              code_text = values.get("VERSION_CODE", "")
              if not code_text.isdigit() or int(code_text) <= 0:
                  raise SystemExit(f"{source} 的 VERSION_CODE 必须是正整数，实际为：{code_text!r}")

              return tuple(map(int, match.groups())), int(code_text), name

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True, encoding="utf-8").strip()

          current_text = Path(VERSION_FILE).read_text(encoding="utf-8")
          current_semver, current_code, current_name = parse_properties(current_text, VERSION_FILE)

          base_sha = Path("/dev/null")
          base_ref = __import__("os").environ["BASE_SHA"]
          changed = [line for line in git("diff", "--name-only", base_ref, "HEAD").splitlines() if line]
          relevant = [
              path for path in changed
              if path in RELEVANT_FILES or path.startswith(RELEVANT_PREFIXES)
          ]
          if not relevant:
              print("没有 APK 或构建相关修改，不要求提升版本。")
              raise SystemExit(0)

          if VERSION_FILE not in changed:
              joined = "\n- ".join(relevant)
              raise SystemExit(
                  "检测到 APK 或构建相关修改，但没有更新 version.properties。\n"
                  f"相关文件：\n- {joined}\n"
                  "每次应用更新都必须同时提升 VERSION_NAME 和 VERSION_CODE。"
              )

          try:
              base_text = git("show", f"{base_ref}:{VERSION_FILE}")
              base_semver, base_code, base_name = parse_properties(base_text, f"{base_ref}:{VERSION_FILE}")
          except subprocess.CalledProcessError:
              # 首次引入统一版本文件时，从旧 Gradle 默认值迁移。
              legacy = git("show", f"{base_ref}:app/build.gradle.kts")
              name_match = re.search(
                  r"val\s+resolvedVersionName\s*=.*?\?:\s*\"(\d+\.\d+\.\d+)\"",
                  legacy,
                  re.S,
              )
              code_match = re.search(
                  r"val\s+resolvedVersionCode\s*=.*?\?:\s*(\d+)",
                  legacy,
                  re.S,
              )
              if not name_match or not code_match:
                  raise SystemExit("无法从基线读取旧版本号")
              base_name = name_match.group(1)
              base_semver = tuple(map(int, base_name.split(".")))
              base_code = int(code_match.group(1))

          if current_semver <= base_semver:
              raise SystemExit(
                  f"VERSION_NAME 必须递增：基线为 {base_name}，当前为 {current_name}"
              )
          if current_code <= base_code:
              raise SystemExit(
                  f"VERSION_CODE 必须递增：基线为 {base_code}，当前为 {current_code}"
              )

          print(
              f"版本检查通过：{base_name} ({base_code}) -> "
              f"{current_name} ({current_code})"
          )
          PY

name: Agent remove assessment separators

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-remove-assessment-separators.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove top and bottom faint separators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/AssessmentSessionScreen.kt')
          text = path.read_text(encoding='utf-8')
          line = '        Box(Modifier.fillMaxWidth().height(1.dp).background(InteractiveLine))\n'
          if text.count(line) != 2:
              raise SystemExit(f'expected two assessment separators, found {text.count(line)}')
          path.write_text(text.replace(line, ''), encoding='utf-8')
          PY
      - name: Commit separator cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/AssessmentSessionScreen.kt
          git commit -m "移除答题页上下浅色分隔线"
          git push origin HEAD:dev

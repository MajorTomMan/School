name: One-time GitHub Release Cleanup

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/release-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove retired course release and stale dev asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view course-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete course-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" --jq '.assets[] | select(.name == "school-debug.apk.cert-sha256") | .id' | head -n1)"
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          fi

          if gh release view course-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "course-latest still exists" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" --jq '.assets[].name' | grep -Fx 'school-debug.apk.cert-sha256' >/dev/null; then
            echo "stale dev asset still exists" >&2
            exit 1
          fi

          echo "GitHub Release cleanup verified."

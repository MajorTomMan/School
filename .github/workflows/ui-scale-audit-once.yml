name: One-time UI Scale Audit Fix

on:
  push:
    branches: [agent/fix-path-trend-scale]
    paths:
      - ".github/workflows/ui-scale-audit-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-path-trend-scale
          fetch-depth: 0

      - name: Apply responsive text-scale fixes
        run: python .github/scripts/ui_scale_patch.py

      - name: Commit fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui
          git commit -m "统一修复大字号页面布局"
          git push origin HEAD:agent/fix-path-trend-scale

name: Agent fix SchoolApp brace

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-fix-schoolapp-brace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Close lesson AnimatedContent before PDF overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/SchoolApp.kt')
          text = path.read_text(encoding='utf-8')
          old = '''            }
        }
        if (textbookPage != null && openedTextbook != null) {
'''
          new = '''            }
        }
        }
        if (textbookPage != null && openedTextbook != null) {
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one SchoolApp closing location, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/SchoolApp.kt
          git commit -m "修复PDF覆盖层组合结构"
          git push origin HEAD:dev

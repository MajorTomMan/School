name: Course Contract CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "courses/**"
      - "tools/course-content/**"
      - "tools/check_visualization_contract_sync.py"
      - "visualization/**"
      - "app/src/main/java/com/majortomman/school/learning/course/**"
      - "app/src/main/java/com/majortomman/school/learning/cloud/**"
      - ".github/workflows/course.yml"
  push:
    branches: [dev]
    paths:
      - "courses/**"
      - "tools/course-content/**"
      - "tools/check_visualization_contract_sync.py"
      - "visualization/**"
      - "app/src/main/java/com/majortomman/school/learning/course/**"
      - "app/src/main/java/com/majortomman/school/learning/cloud/**"
      - ".github/workflows/course.yml"

permissions:
  contents: read

concurrency:
  group: course-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-course-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject retired compressed authored sources
        shell: bash
        run: |
          set -euo pipefail
          if find courses -type f -name 'course.json.gz.b64.part*' -print -quit | grep -q .; then
            echo "Retired gzip/base64 course source parts are not allowed. Keep one readable course.json per authored course." >&2
            exit 1
          fi

      - name: Validate authored courses
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find courses -type f -name 'course.json' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No authored course.json files found." >&2
            exit 1
          fi
          test -f courses/pep-math-7-1/course.json
          python3 tools/course-content/validate_authored_course.py "${files[@]}"

      - name: Validate PEP math 7-1 textbook structure
        run: python3 tools/course-content/validate_pep_math_7_1_editorial.py courses/pep-math-7-1/course.json

      - name: Verify renderer contract synchronization
        run: python3 tools/check_visualization_contract_sync.py

      - name: Compile course contract tooling
        run: |
          python3 -m py_compile \
            tools/check_visualization_contract_sync.py \
            tools/course-content/visualization_contract.py \
            tools/course-content/validate_authored_course.py \
            tools/course-content/validate_pep_math_7_1_editorial.py

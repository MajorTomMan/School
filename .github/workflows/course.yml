name: Course Contract CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "courses/**"
      - "tools/course-content/**"
      - "tools/check_visualization_contract_sync.py"
      - "visualization/**"
      - "app/src/main/java/com/majortomman/school/learning/course/**"
      - "app/src/main/java/com/majortomman/school/learning/cloud/**"
      - ".github/workflows/course.yml"
  push:
    branches: [dev]
    paths:
      - "courses/**"
      - "tools/course-content/**"
      - "tools/check_visualization_contract_sync.py"
      - "visualization/**"
      - "app/src/main/java/com/majortomman/school/learning/course/**"
      - "app/src/main/java/com/majortomman/school/learning/cloud/**"
      - ".github/workflows/course.yml"

permissions:
  contents: read

concurrency:
  group: course-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-course-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and validate authored courses
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find courses -type f -name '*.json' | sort)

          while IFS= read -r first; do
            dir="$(dirname "$first")"
            relative="${dir#courses/}"
            encoded="$tmp/$relative/course.json.gz.b64"
            archive="$tmp/$relative/course.json.gz"
            target="$tmp/$relative/course.json"
            mkdir -p "$(dirname "$target")"
            cat "$dir"/course.json.gz.b64.part* > "$encoded"
            base64 --decode "$encoded" > "$archive"
            gzip --test "$archive"
            gzip -dc "$archive" > "$target"
            if [ "$relative" = "pep-math-7-1" ]; then
              test "$(find "$dir" -maxdepth 1 -type f -name 'course.json.gz.b64.part*' | wc -l)" -eq 8
              test "$(stat -c%s "$target")" = "270303"
              printf '%s  %s\n' '30eb89c3f6c292f461df74541f901e87ec2391bdbc415d6ff9559de6057eddc6' "$target" | sha256sum --check --strict
            fi
            files+=("$target")
          done < <(find courses -type f -name 'course.json.gz.b64.part01' | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No authored course JSON files found." >&2
            exit 1
          fi
          python3 tools/course-content/validate_authored_course.py "${files[@]}"

      - name: Verify renderer contract synchronization
        run: python3 tools/check_visualization_contract_sync.py

      - name: Compile course contract tooling
        run: |
          python3 -m py_compile \
            tools/check_visualization_contract_sync.py \
            tools/course-content/visualization_contract.py \
            tools/course-content/validate_authored_course.py

      - name: Reject retired OCR/page, assessment and scene compatibility pipelines
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            tools/course_quality
            tools/course-content/manual
            tools/course-content/generate_math_courses.py
            tools/course-content/audit_math_courses.py
            tools/course-content/normalize_course_contract.py
            tools/course-content/pdf_asset_workflow.py
            tools/course-content/postprocess_math_courses.py
            tools/course-content/prepare_assessment_packages.py
            tools/course-content/migrate_scene_visualizations.py
          )
          for path in "${retired[@]}"; do
            if [ -e "$path" ]; then
              echo "Retired course/scene pipeline path must not return: $path" >&2
              exit 1
            fi
          done

name: Agent decardify active UI

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-decardify-active-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply line-based active UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Course lesson notice and navigation.
          path = Path('app/src/main/java/com/majortomman/school/ui/CloudCourseLessonScreen.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.shape.RoundedCornerShape\n', '')
          text = text.replace(
              '''                .padding(top = 14.dp)
                .background(InteractivePanel, RoundedCornerShape(12.dp))
                .padding(horizontal = 14.dp, vertical = 10.dp),''',
              '''                .padding(top = 14.dp, bottom = 4.dp),''',
          )
          marker = '@Composable\nprivate fun CloudNavigationAction('
          if marker in text:
              start = text.index(marker)
              text = text[:start] + '''@Composable
private fun CloudNavigationAction(
    label: String,
    enabled: Boolean,
    alignment: TextAlign,
    onClick: () -> Unit,
) {
    Box(
        modifier = Modifier
            .width(112.dp)
            .heightIn(min = 44.dp)
            .clickable(enabled = enabled, onClick = onClick),
        contentAlignment = when (alignment) {
            TextAlign.Start -> Alignment.CenterStart
            TextAlign.End -> Alignment.CenterEnd
            else -> Alignment.Center
        },
    ) {
        Text(
            label,
            modifier = Modifier.padding(horizontal = 4.dp, vertical = 12.dp),
            color = if (enabled) InteractiveBlue else InteractiveMuted.copy(alpha = 0.35f),
            fontSize = 14.sp,
            fontWeight = FontWeight.SemiBold,
            textAlign = alignment,
        )
        Box(
            Modifier
                .align(Alignment.BottomCenter)
                .fillMaxWidth()
                .height(if (enabled) 2.dp else 1.dp)
                .background(if (enabled) InteractiveBlue.copy(alpha = 0.72f) else InteractiveLine),
        )
    }
}
'''
          path.write_text(text, encoding='utf-8')

          # PDF page status: preserve layout, remove pill surface.
          path = Path('app/src/main/java/com/majortomman/school/ui/PdfTextbookScreen.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.shape.RoundedCornerShape\n', '')
          text = text.replace(
              '''                    .background(ReaderWhite.copy(alpha = 0.07f), RoundedCornerShape(12.dp))
                    .padding(horizontal = 11.dp, vertical = 7.dp),''',
              '''                    .padding(horizontal = 2.dp, vertical = 7.dp),''',
          )
          path.write_text(text, encoding='utf-8')

          # Path row no longer needs a rounded hit-area clip.
          path = Path('app/src/main/java/com/majortomman/school/ui/Screens.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.shape.RoundedCornerShape\n', '')
          text = text.replace('import androidx.compose.ui.draw.clip\n', '')
          text = text.replace('            .clip(RoundedCornerShape(24.dp))\n', '')
          path.write_text(text, encoding='utf-8')

          # Bank selections and inputs become open text regions. Semantic color remains the state signal.
          path = Path('app/src/main/java/com/majortomman/school/ui/MathQuestionBankScreen.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import androidx.compose.foundation.shape.RoundedCornerShape\n', '')
          text = text.replace('import androidx.compose.foundation.border\n', '')
          text = re.sub(r'\n\s*\.border\([^\n]*RoundedCornerShape\(5\.dp\)\)', '', text)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/CloudCourseLessonScreen.kt app/src/main/java/com/majortomman/school/ui/PdfTextbookScreen.kt app/src/main/java/com/majortomman/school/ui/Screens.kt app/src/main/java/com/majortomman/school/ui/MathQuestionBankScreen.kt
          git commit -m "refactor(ui): decardify active navigation and question bank" || exit 0
          git pull --rebase origin dev
          git push origin dev

name: Agent decardify active UI

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-decardify-active-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Confirm task execution
        shell: bash
        run: |
          echo "active UI task executed" > .agent-active-ui-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-active-ui-result.txt
          git commit -m "chore: confirm active UI task"
          git pull --rebase origin dev
          git push origin dev

name: Update course release check

on:
  push:
    branches: [agent/section-assessment-ai]
    paths:
      - ".github/workflows/agent-update-course-release-check.yml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/agent-update-course-release-check.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-assessment-ai
      - name: Update release assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/course-r2-release.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '                      "assets/figures/number-line-road-source.png",\n': '',
              '                  assert required <= set(bundled)\n': (
                  '                  assert required <= set(bundled)\n'
                  '                  assert not any(path.startswith("assets/figures/") for path in bundled)\n'
              ),
              '                  assert len(assessments["questionSets"]) == 3\n':
                  '                  assert len(assessments["questionSets"]) == 4\n',
              '                  assert sum(len(item["questions"]) for item in assessments["questionSets"]) == 15\n':
                  '                  assert sum(len(item["questions"]) for item in assessments["questionSets"]) == 20\n',
              '                  assert len(knowledge["knowledgePoints"]) == 9\n':
                  '                  assert len(knowledge["knowledgePoints"]) == 11\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit release check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/course-r2-release.yml
          git commit -m "更新课程发布题组验收标准"
          git push origin HEAD:agent/section-assessment-ai

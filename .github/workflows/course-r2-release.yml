name: Course R2 Release

on:
  pull_request:
    paths:
      - "tools/course-content/**"
      - ".github/workflows/course-r2-release.yml"
      - "app/src/test/**/Grade7SampleAssessmentContractTest.kt"
  push:
    branches: [master]
    paths:
      - "tools/course-content/**"
      - ".github/workflows/course-r2-release.yml"
      - "app/src/test/**/Grade7SampleAssessmentContractTest.kt"
  workflow_dispatch:
    inputs:
      action:
        description: "发布动作"
        required: true
        default: "publish-testing"
        type: choice
        options:
          - publish-testing
          - promote-stable
      release_id:
        description: "可选 release ID；提升 stable 时必须填写已经通过 testing 的 ID"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: course-r2-${{ github.ref }}-${{ inputs.action || 'build' }}
  cancel-in-progress: false

env:
  COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}

jobs:
  build-and-publish-testing:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'publish-testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF validation dependency
        run: python3 -m pip install --disable-pip-version-check --quiet PyMuPDF

      - name: Compile and test publisher scripts
        run: |
          python3 -m py_compile tools/course-content/*.py
          python3 -m unittest discover -s tools/course-content -p 'test_*.py' -v

      - name: Resolve immutable release ID
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_RELEASE_ID:-}" ]; then
            release_id="$REQUESTED_RELEASE_ID"
          else
            release_id="$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$release_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release ID 格式无效：$release_id" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "### Course release: \`$release_id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify six textbook PDFs
        shell: bash
        run: |
          set -euo pipefail
          root="build/course-source"
          mkdir -p "$root"
          download() {
            local id="$1" name="$2" size="$3" digest="$4"
            local target="$root/$name"
            curl --fail --location --retry 4 --retry-delay 2 \
              --output "$target" \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            test "$(stat -c%s "$target")" = "$size"
            printf '%s  %s\n' "$digest" "$target" | sha256sum --check --strict
          }
          download 1zPJIoh7Ora3AOMLXfDll8YbAZ8u1v78N '义务教育教科书·数学七年级上册.pdf' 12915486 11b6f1fbfa46eee4158953ef745ae1e6fbe6b9527a1423d55cbe75729e8210b9
          download 15pn2jQjlWO6g4SCK5w2ys3SO8aTE-Kjh '义务教育教科书·数学七年级下册.pdf' 29820133 a58d058dd4f6a0855558a90a24640d9cf3ff8430112fb4d1f434bd881f836210
          download 1spnH7HoU9wSX_J3HqdClU8an4wsWNTB6 '义务教育教科书·数学八年级上册.pdf' 10148104 e21e7094a470f74a5be947e5fa8a9eee57bd6a4deaaaba3dbd09b811590838ed
          download 1lJJzJupEt6FThZDB6WMH8AI09W2fT20D '义务教育教科书·数学八年级下册.pdf' 20284130 4979e490f518912473519aafc2b7e016aa804741ac7efbaa4156d230d9dc8b3c
          download 1ArtD3pcWtIeawWPNSAVudUVk1X0hqWKx '义务教育教科书·数学九年级上册.pdf' 9609936 b6d43c0601c07a6a6f68d3be065c863b41529745e739b4496154c90ecbe7140d
          download 12p2aGGugc_EvrO-Kqb17MHzMAqXvHTBn '义务教育教科书·数学九年级下册.pdf' 11303872 a71d30eb32b0e43737c88ada99a76ae6b5959050dc53c491b5206bae2d31b0ce

      - name: Generate, review and attach course sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/diagnostics
          {
            python3 tools/course-content/generate_math_courses.py \
              --pdf-root build/course-source \
              --output-root build/generated-course
            python3 tools/course-content/postprocess_math_courses.py \
              --source-root build/generated-course
            python3 tools/course-content/prepare_assessment_packages.py \
              --source-root build/generated-course \
              --pdf-root build/course-source
          } 2>&1 | tee build/diagnostics/assessment-prepare.log

      - name: Validate source anchors against textbooks
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            python3 tools/course-content/validate_course_sources.py \
              --source "build/generated-course/$1/course.json" \
              --pdf "build/course-source/$2" \
              --page-index-offset 7 \
              --expected-page-count "$3"
          }
          validate pep-math-7-1 '义务教育教科书·数学七年级上册.pdf' 202
          validate pep-math-7-2 '义务教育教科书·数学七年级下册.pdf' 202
          validate pep-math-8-1 '义务教育教科书·数学八年级上册.pdf' 182
          validate pep-math-8-2 '义务教育教科书·数学八年级下册.pdf' 206
          validate pep-math-9-1 '义务教育教科书·数学九年级上册.pdf' 163
          validate pep-math-9-2 '义务教育教科书·数学九年级下册.pdf' 122

      - name: Audit generated wording and renderer coverage
        run: |
          python3 tools/course-content/audit_math_courses.py \
            --source-root build/generated-course \
            --pdf-root build/course-source

      - name: Convert to strict APK course contract
        run: |
          python3 tools/course-content/normalize_course_contract.py \
            --source-root build/generated-course \
            --output-root build/runtime-course
          python3 tools/course-content/copy_assessment_extensions.py \
            --source-root build/generated-course \
            --output-root build/runtime-course

      - name: Build immutable R2 release
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          python3 tools/course-content/build_all_math_course_release.py \
            --source-root build/runtime-course \
            --pdf-root build/course-source \
            --output build/course-release \
            --release-id "$RELEASE_ID" \
            --public-base-url "$COURSE_BASE_URL/cloud/course/public"

      - name: Validate current APK distribution manifest
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          root = Path("build/course-release")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert set(manifest) == {"textbooks"}
          assert len(manifest["textbooks"]) == 6
          expected = {"pep-math-7-1", "pep-math-7-2", "pep-math-8-1", "pep-math-8-2", "pep-math-9-1", "pep-math-9-2"}
          assert {item["id"] for item in manifest["textbooks"]} == expected
          release_id = os.environ["RELEASE_ID"]
          prefix = f"{os.environ['COURSE_BASE_URL']}/cloud/course/public/releases/{release_id}/"

          for textbook in manifest["textbooks"]:
              assert set(textbook) == {"id", "package", "files"}
              assert set(textbook["package"]) == {"path", "url", "size", "sha256"}
              assert textbook["package"]["url"].startswith(prefix)
              files = {entry["path"]: entry for entry in textbook["files"]}
              assert files["course.json"]["bundled"] is True
              assert files["assets/textbook.pdf"]["bundled"] is False
              bundled = sorted(path for path, entry in files.items() if entry["bundled"])
              book_root = root / textbook["id"]
              with zipfile.ZipFile(book_root / "course.zip") as archive:
                  assert archive.namelist() == bundled
                  assert set(archive.namelist()) == set(bundled)
              course = json.loads((book_root / "course.json").read_text(encoding="utf-8"))
              assert set(course) == {"textbook", "chapters"}
              assert set(course["textbook"]["pdf"]) == {"path", "pageCount", "pageIndexOffset"}
              if textbook["id"] == "pep-math-7-1":
                  required = {
                      "course.json",
                      "assessments.json",
                      "knowledge-points.json",
                      "assets/figures/number-line-road-source.png",
                  }
                  assert required <= set(bundled)
                  assessments = json.loads((book_root / "assessments.json").read_text(encoding="utf-8"))
                  knowledge = json.loads((book_root / "knowledge-points.json").read_text(encoding="utf-8"))
                  assert len(assessments["questionSets"]) == 3
                  assert sum(len(item["questions"]) for item in assessments["questionSets"]) == 15
                  assert len(knowledge["knowledgePoints"]) == 9
              else:
                  assert "assessments.json" not in files
                  assert "knowledge-points.json" not in files
          print("R2 course release with assessment extensions validated")
          PY

      - name: Upload course build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-r2-${{ steps.release.outputs.release_id }}
          path: |
            build/course-release/
            build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish immutable release to testing
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish-testing')
        env:
          COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$COURSE_API_TOKEN" || {
            echo "缺少 GitHub Actions Secret: COURSE_API_TOKEN" >&2
            exit 1
          }
          python3 tools/course-content/publish_course_r2.py upload \
            --root build/course-release \
            --release-id "$RELEASE_ID" \
            --channel testing
          echo "Testing manifest: $COURSE_BASE_URL/cloud/course/public/testing/manifest.json" >> "$GITHUB_STEP_SUMMARY"

  promote-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote tested release to stable
        env:
          COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || {
            echo "promote-stable 必须填写 release_id" >&2
            exit 1
          }
          test -n "$COURSE_API_TOKEN" || {
            echo "缺少 GitHub Actions Secret: COURSE_API_TOKEN" >&2
            exit 1
          }
          python3 tools/course-content/publish_course_r2.py promote \
            --release-id "$RELEASE_ID" \
            --channel stable
          echo "Stable release: \`$RELEASE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable manifest: $COURSE_BASE_URL/cloud/course/public/stable/manifest.json" >> "$GITHUB_STEP_SUMMARY"

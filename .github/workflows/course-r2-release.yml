name: Course R2 Release

on:
  push:
    branches: [dev]
    paths:
      - "courses/pep-math-7-1/**"
      - "tools/course-content/build_course_release.py"
      - "tools/course-content/course_release_bundle.py"
      - "tools/course-content/publish_course_r2.py"
      - "tools/course-content/validate_authored_course.py"
      - ".github/workflows/course-r2-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-r2-${{ github.ref }}
  cancel-in-progress: false

env:
  COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}

jobs:
  publish-pep-math-7-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and validate authored course
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/authored/pep-math-7-1
          gzip -dc courses/pep-math-7-1/course.json.gz > build/authored/pep-math-7-1/course.json
          python3 tools/course-content/validate_authored_course.py build/authored/pep-math-7-1/course.json

      - name: Compile release tools
        run: |
          python3 -m py_compile \
            tools/course-content/build_course_release.py \
            tools/course-content/course_release_bundle.py \
            tools/course-content/publish_course_r2.py \
            tools/course-content/validate_authored_course.py

      - name: Resolve immutable release ID
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "### Course release: \`$release_id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify textbook PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/course-source
          target="build/course-source/textbook.pdf"
          curl --fail --location --retry 4 --retry-delay 2 \
            --output "$target" \
            "https://drive.usercontent.google.com/download?id=1zPJIoh7Ora3AOMLXfDll8YbAZ8u1v78N&export=download&confirm=t"
          test "$(stat -c%s "$target")" = "12915486"
          printf '%s  %s\n' \
            '11b6f1fbfa46eee4158953ef745ae1e6fbe6b9527a1423d55cbe75729e8210b9' \
            "$target" | sha256sum --check --strict

      - name: Build immutable authored release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 tools/course-content/build_course_release.py \
            --source build/authored/pep-math-7-1/course.json \
            --pdf build/course-source/textbook.pdf \
            --output build/course-release \
            --release-id "$RELEASE_ID" \
            --public-base-url "$COURSE_BASE_URL/cloud/course/public"

      - name: Verify release package
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path

          root = Path('build/course-release')
          source = json.loads(Path('build/authored/pep-math-7-1/course.json').read_text(encoding='utf-8'))
          built = json.loads((root / 'pep-math-7-1/course.json').read_text(encoding='utf-8'))
          assert built == source
          assert set(built) == {'textbook', 'knowledgePoints', 'chapters'}
          assert built['textbook']['id'] == 'pep-math-7-1'
          assert built['textbook']['pdf'] == {'path': 'assets/textbook.pdf', 'pageCount': 202, 'pageIndexOffset': 7}

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert set(manifest) == {'textbooks'}
          assert len(manifest['textbooks']) == 1
          textbook = manifest['textbooks'][0]
          assert set(textbook) == {'id', 'package', 'files'}
          assert textbook['id'] == 'pep-math-7-1'
          assert set(textbook['package']) == {'path', 'url', 'size', 'sha256'}
          files = {item['path']: item for item in textbook['files']}
          assert set(files) == {'course.json', 'assets/textbook.pdf'}
          assert files['course.json']['bundled'] is True
          assert files['assets/textbook.pdf']['bundled'] is False
          prefix = f"{os.environ['COURSE_BASE_URL']}/cloud/course/public/releases/{os.environ['RELEASE_ID']}/"
          assert textbook['package']['url'].startswith(prefix)
          assert all(item['url'].startswith(prefix) for item in textbook['files'])
          with zipfile.ZipFile(root / 'pep-math-7-1/course.zip') as archive:
              assert archive.namelist() == ['course.json']
              archived = json.loads(archive.read('course.json'))
              assert archived == source
          print('authored R2 release package validated')
          PY

      - name: Upload immutable release and publish testing
        shell: bash
        env:
          COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          test -n "$COURSE_API_TOKEN" || { echo "缺少 GitHub Actions Secret: COURSE_API_TOKEN" >&2; exit 1; }
          python3 tools/course-content/publish_course_r2.py upload \
            --root build/course-release \
            --release-id "$RELEASE_ID" \
            --channel testing

      - name: Verify testing channel
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            "$COURSE_BASE_URL/cloud/course/public/testing/manifest.json" \
            -o build/testing-manifest.json
          cmp build/course-release/manifest.json build/testing-manifest.json

      - name: Promote verified release to stable
        shell: bash
        env:
          COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 tools/course-content/publish_course_r2.py promote \
            --release-id "$RELEASE_ID" \
            --channel stable

      - name: Verify stable channel
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            "$COURSE_BASE_URL/cloud/course/public/stable/manifest.json" \
            -o build/stable-manifest.json
          cmp build/course-release/manifest.json build/stable-manifest.json
          echo "Testing: $COURSE_BASE_URL/cloud/course/public/testing/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable: $COURSE_BASE_URL/cloud/course/public/stable/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Published release: \`$RELEASE_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-r2-${{ steps.release.outputs.release_id }}
          path: build/course-release/
          if-no-files-found: ignore
          retention-days: 14

name: Step 7 One-shot Course Verification v2

on:
  push:
    branches:
      - ops/verify-promote-step7
    paths:
      - .github/workflows/step7-one-shot-promotion-v2.yml

permissions:
  contents: read
  issues: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COURSE_BASE_URL: ${{ vars.COURSE_BASE_URL || 'https://course.flashnamesl.workers.dev' }}
      COURSE_API_TOKEN: ${{ secrets.COURSE_API_TOKEN }}
      EXPECTED_MASTER_SHA: 7110d3e970d5f2ae3cfd21b0ad0e8033e04c5aea
      RECEIPT_PR: '88'
    steps:
      - uses: actions/checkout@v4

      - name: Execute one-shot verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed -n '34,$p' .github/workflows/step7-one-shot-promotion.yml \
            | sed 's/^          //' > /tmp/step7-one-shot.sh
          bash /tmp/step7-one-shot.sh

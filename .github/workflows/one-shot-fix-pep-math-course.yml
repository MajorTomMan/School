name: One-shot PEP Math Course Repair

on:
  push:
    branches:
      - course/rebuild-pep-math-7-1
    paths:
      - ".github/workflows/one-shot-fix-pep-math-course.yml"
      - "courses/pep-math-7-1/course.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: course/rebuild-pep-math-7-1

      - name: Repair exact authored-source escapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('courses/pep-math-7-1/course.json')
          text = path.read_text(encoding='utf-8')
          old = r'"expression":"a\div b=a\times\frac{1}{b}"'
          new = '"expression":"a/b=a(1/b)"'
          if old not in text:
              raise SystemExit('expected invalid division formula escape not found')
          text = text.replace(old, new, 1)
          text = text.replace('"label":"教材第7页起"', '"label":"教材第7页"', 1)
          json.loads(text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- courses/pep-math-7-1/course.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add courses/pep-math-7-1/course.json
          git commit -m "course: repair authored json formula escape"
          git push origin HEAD:course/rebuild-pep-math-7-1

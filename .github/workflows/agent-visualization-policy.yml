name: Agent visualization policy

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-visualization-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Migrate production diagrams to shared zoom and typography
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          selected = [
              'app/src/main/java/com/majortomman/school/ui/CloudCourseBlockRenderer.kt',
              'app/src/main/java/com/majortomman/school/ui/CloudCourseVisualizations.kt',
              'app/src/main/java/com/majortomman/school/ui/TextbookMathVisualizations.kt',
              'app/src/main/java/com/majortomman/school/ui/RationalExamplesVisual.kt',
              'app/src/main/java/com/majortomman/school/ui/OppositeQuantitiesSceneVisual.kt',
          ]
          for name in selected:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('import androidx.compose.foundation.Canvas\n', '')
              updated = updated.replace('Canvas(', 'ZoomableMathCanvas(')
              updated = updated.replace('this.textSize = textSize\n', 'this.textSize = visualTextSizePx(textSize)\n')
              if path.name == 'CloudCourseVisualizations.kt':
                  updated = updated.replace('textSize: Float = 24f,', 'textSize: Float = 16f,')
              if path.name == 'RationalExamplesVisual.kt':
                  updated = updated.replace('fontSize = 8.sp,', 'fontSize = 13.sp,')
                  updated = updated.replace('.padding(horizontal = 4.dp, vertical = 2.dp)', '.padding(horizontal = 7.dp, vertical = 4.dp)')
              if updated == text:
                  raise SystemExit(f'No visualization changes made in {name}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit visualization policy migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui
          git commit -m "统一生产数学可视化缩放与文字规范"
          git push origin HEAD:dev

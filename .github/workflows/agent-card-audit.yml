name: Agent global card audit

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-card-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Audit UI card surfaces
        shell: bash
        run: |
          {
            echo '# Rounded shapes / cards / panel surfaces'
            grep -RInE 'RoundedCornerShape|\bCard\(|\bSurface\(|\.background\([^\n]*(Panel|Card|Surface)' app/src/main/java/com/majortomman/school/ui --include='*.kt' || true
            echo
            echo '# UI files'
            find app/src/main/java/com/majortomman/school/ui -maxdepth 1 -type f -name '*.kt' | sort
          } > .agent-card-audit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-card-audit.txt
          git commit -m "chore: record global card audit"
          git pull --rebase origin dev
          git push origin dev

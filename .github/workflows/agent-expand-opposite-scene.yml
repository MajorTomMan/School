name: Agent expand opposite scene

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-expand-opposite-scene.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Give illustrated scenes enough responsive height
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/majortomman/school/ui/CloudCourseBlockRenderer.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        CourseSceneTemplate.OPPOSITE_QUANTITIES,
          CourseSceneTemplate.INTEGER_TO_FRACTION,
          CourseSceneTemplate.RATIONAL_CLASSIFICATION,
          -> if (compact) 360.dp else 420.dp
          '''
          new = '''        CourseSceneTemplate.OPPOSITE_QUANTITIES -> if (compact) 470.dp else 520.dp

          CourseSceneTemplate.INTEGER_TO_FRACTION,
          CourseSceneTemplate.RATIONAL_CLASSIFICATION,
          -> if (compact) 360.dp else 420.dp
          '''
          if old not in text:
              raise SystemExit('scene height block did not match expected source')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/CloudCourseBlockRenderer.kt
          git commit -m "为具象相反意义量场景预留自适应高度"
          git pull --rebase origin dev
          git push origin dev

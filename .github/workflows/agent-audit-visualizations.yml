name: Agent audit visualizations

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-audit-visualizations.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Record visualization sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent
          {
            echo "Canvas calls:"
            grep -RIn --include='*.kt' -E '(^|[^A-Za-z])Canvas\(' app/src/main/java || true
            echo
            echo "drawContext/nativeCanvas calls:"
            grep -RIn --include='*.kt' -E 'nativeCanvas|drawText\(' app/src/main/java/com/majortomman/school/ui || true
            echo
            echo "visual scene renderers:"
            grep -RIn --include='*.kt' -E 'CourseSceneTemplate|NUMBER_LINE|CARTESIAN|FUNCTION_GRAPH|DECLARATIVE_DIAGRAM' app/src/main/java/com/majortomman/school/ui || true
          } > .agent/visualization-audit.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/visualization-audit.log
          git commit -m "记录全项目可视化组件审计"
          git push origin HEAD:dev

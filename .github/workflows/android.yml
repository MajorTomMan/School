name: Android CI/CD

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - "visualization/**"
      - "tools/check_visualization_isolation.py"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "signing/**"
      - ".github/workflows/android.yml"
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "visualization/**"
      - "tools/check_visualization_isolation.py"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "signing/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          name="$(sed -n 's/^VERSION_NAME=//p' version.properties | tail -n1 | tr -d '[:space:]')"
          code="$(sed -n 's/^VERSION_CODE=//p' version.properties | tail -n1 | tr -d '[:space:]')"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_NAME 必须使用 x.y.z 格式" >&2
            exit 1
          fi
          if ! [[ "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "VERSION_CODE 必须是正整数" >&2
            exit 1
          fi
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"

      - name: Detect development release
        id: release
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          should_publish=false
          version_changed=false
          code_changed=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            if [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git diff --name-only "$BEFORE_SHA" HEAD -- version.properties | grep -q '^version.properties$'; then
              version_changed=true
            fi

            git fetch --force origin "refs/tags/dev-latest:refs/tags/dev-latest" >/dev/null 2>&1 || true
            if git rev-parse -q --verify refs/tags/dev-latest >/dev/null; then
              previous_name="$(git show refs/tags/dev-latest:version.properties | sed -n 's/^VERSION_NAME=//p' | tail -n1 | tr -d '[:space:]')"
              previous_code="$(git show refs/tags/dev-latest:version.properties | sed -n 's/^VERSION_CODE=//p' | tail -n1 | tr -d '[:space:]')"
              if [[ "$VERSION_NAME" == "$previous_name" || "$VERSION_CODE" -le "$previous_code" ]]; then
                version_changed=false
              fi

              while IFS= read -r path; do
                case "$path" in
                  app/*|visualization/*|tools/check_visualization_isolation.py|build.gradle.kts|settings.gradle.kts|gradle.properties|gradle/*|signing/*)
                    code_changed=true
                    break
                    ;;
                esac
              done < <(git diff --name-only refs/tags/dev-latest..HEAD)
            else
              code_changed=true
            fi

            if [[ "$version_changed" == "true" && "$code_changed" == "true" ]]; then
              should_publish=true
            fi
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "发布检测：version_changed=$version_changed, code_changed=$code_changed, should_publish=$should_publish"

      - name: Enforce visualization isolation
        run: python3 tools/check_visualization_isolation.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Verify development signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/school-development.jks"
          base64 --decode signing/school-development.jks.b64 > "$keystore"
          expected="$(tr -d '[:space:]:' < signing/school-development.cert.sha256 | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -list -v -keystore "$keystore" -storepass android -alias schooldev | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual"
          test "$actual" = "$expected"

      - name: Test and assemble debug APK
        env:
          SCHOOL_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SCHOOL_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SCHOOL_FIREBASE_PROJECT_ID: ${{ vars.SCHOOL_FIREBASE_PROJECT_ID }}
          SCHOOL_FIREBASE_APPLICATION_ID: ${{ vars.SCHOOL_FIREBASE_APPLICATION_ID }}
          SCHOOL_FIREBASE_API_KEY: ${{ vars.SCHOOL_FIREBASE_API_KEY }}
          SCHOOL_FIREBASE_SENDER_ID: ${{ vars.SCHOOL_FIREBASE_SENDER_ID }}
          SCHOOL_FIREBASE_UPDATE_TOPIC: ${{ vars.SCHOOL_FIREBASE_UPDATE_TOPIC }}
        run: gradle :visualization:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare development update package
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SCHOOL_UPDATE_PRIVATE_KEY_B64: ${{ secrets.SCHOOL_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/school-debug.apk
          sha256sum dist/school-debug.apk > dist/school-debug.apk.sha256
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, os

          notes_file = Path('.release-notes/current.md')
          notes = notes_file.read_text(encoding='utf-8') if notes_file.is_file() else ''
          changes = [line.strip()[2:].strip() for line in notes.splitlines() if line.strip().startswith('- ') and line.strip()[2:].strip()]
          apk = Path('dist/school-debug.apk')
          cert = Path('signing/school-development.cert.sha256').read_text().strip().replace(':', '').lower()
          manifest = {
              'schemaVersion': 1,
              'channel': 'development',
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': os.environ['VERSION_NAME'],
              'minimumSupportedVersionCode': 0,
              'mandatory': False,
              'publishedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'changes': changes,
              'fixes': [],
              'apk': {
                  'fileName': 'school-debug.apk',
                  'downloadUrl': 'https://github.com/MajorTomMan/school/releases/download/dev-latest/school-debug.apk',
                  'size': apk.stat().st_size,
                  'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                  'certificateSha256': cert,
              },
          }
          Path('dist/update-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          private_key="$RUNNER_TEMP/school-update-private.pem"
          if [[ -n "${SCHOOL_UPDATE_PRIVATE_KEY_B64:-}" ]]; then
            printf '%s' "$SCHOOL_UPDATE_PRIVATE_KEY_B64" | base64 --decode > "$private_key"
          else
            base64 --decode signing/school-update-development-private.pem.b64 > "$private_key"
          fi
          chmod 600 "$private_key"
          openssl dgst -sha256 -sign "$private_key" -out dist/update-manifest.sig dist/update-manifest.json
          openssl dgst -sha256 -verify signing/school-update-development-public.pem -signature dist/update-manifest.sig dist/update-manifest.json

      - name: Upload development package
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: school-debug-apk
          path: |
            dist/school-debug.apk
            dist/school-debug.apk.sha256
            dist/update-manifest.json
            dist/update-manifest.sig

  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.test-build.outputs.should_publish == 'true'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: school-debug-apk
          path: dist

      - name: Publish rolling development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.test-build.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="dev-latest"
          title="School ${VERSION_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          assets=(dist/school-debug.apk dist/school-debug.apk.sha256 dist/update-manifest.json dist/update-manifest.sig)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file .release-notes/current.md --prerelease
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file .release-notes/current.md --prerelease
          fi

name: Android CI/CD

on:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "visualization/**"
      - "scripts/ci/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "signing/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: version
        shell: bash
        run: bash scripts/ci/resolve_version.sh

      - name: Detect development release
        id: release
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: bash scripts/ci/detect_development_release.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Verify development signing key
        shell: bash
        run: bash scripts/ci/verify_development_signing_key.sh

      - name: Test app core and assemble debug APK
        env:
          SCHOOL_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SCHOOL_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SCHOOL_FIREBASE_PROJECT_ID: ${{ vars.SCHOOL_FIREBASE_PROJECT_ID }}
          SCHOOL_FIREBASE_APPLICATION_ID: ${{ vars.SCHOOL_FIREBASE_APPLICATION_ID }}
          SCHOOL_FIREBASE_API_KEY: ${{ vars.SCHOOL_FIREBASE_API_KEY }}
          SCHOOL_FIREBASE_SENDER_ID: ${{ vars.SCHOOL_FIREBASE_SENDER_ID }}
          SCHOOL_FIREBASE_UPDATE_TOPIC: ${{ vars.SCHOOL_FIREBASE_UPDATE_TOPIC }}
        run: bash scripts/ci/test_app_core.sh

      - name: Prepare development update package
        if: steps.release.outputs.should_publish == 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SCHOOL_UPDATE_PRIVATE_KEY_B64: ${{ secrets.SCHOOL_UPDATE_PRIVATE_KEY_B64 }}
        run: python3 scripts/ci/prepare_development_update.py

      - name: Upload development package
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: school-debug-apk
          path: |
            dist/school-debug.apk
            dist/school-debug.apk.sha256
            dist/update-manifest.json
            dist/update-manifest.sig

  publish-development:
    if: needs.test-build.outputs.should_publish == 'true'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: school-debug-apk
          path: dist

      - name: Publish rolling development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.test-build.outputs.version_name }}
        run: bash scripts/ci/publish_development_release.sh

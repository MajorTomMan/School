name: Android CI/CD

on:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "visualization/**"
      - "scripts/ci/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "signing/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCHOOL_UPDATE_CONFIG_URL: ${{ vars.SCHOOL_UPDATE_CONFIG_URL }}
      SCHOOL_UPDATE_URL: ${{ vars.SCHOOL_UPDATE_URL }}
      SCHOOL_FIREBASE_PROJECT_ID: ${{ vars.SCHOOL_FIREBASE_PROJECT_ID }}
      SCHOOL_FIREBASE_APPLICATION_ID: ${{ vars.SCHOOL_FIREBASE_APPLICATION_ID }}
      SCHOOL_FIREBASE_API_KEY: ${{ vars.SCHOOL_FIREBASE_API_KEY }}
      SCHOOL_FIREBASE_SENDER_ID: ${{ vars.SCHOOL_FIREBASE_SENDER_ID }}
      SCHOOL_FIREBASE_UPDATE_TOPIC: ${{ vars.SCHOOL_FIREBASE_UPDATE_TOPIC }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Prepare CI
        run: bash scripts/ci/android_ci.sh prepare

      - name: Test app core and assemble debug APK
        run: bash scripts/ci/android_ci.sh build

      - name: Prepare development update package
        if: env.SHOULD_PUBLISH == 'true'
        env:
          SCHOOL_UPDATE_PRIVATE_KEY_B64: ${{ secrets.SCHOOL_UPDATE_PRIVATE_KEY_B64 }}
        run: bash scripts/ci/android_ci.sh package

      - name: Publish rolling development release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/android_ci.sh publish

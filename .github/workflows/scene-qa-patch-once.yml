name: One-time Scene QA Patch

on:
  push:
    branches: [agent/scene-qa-release-notes]
    paths:
      - ".github/scripts/scene_qa_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scene-qa-release-notes
      - name: Apply scene QA patch
        run: python3 .github/scripts/scene_qa_patch.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app version.properties .release-notes/current.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: refine course scene visualizations"
            git push origin HEAD:agent/scene-qa-release-notes
          fi

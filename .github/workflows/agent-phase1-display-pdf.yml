name: Agent phase 1 display and PDF

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-phase1-display-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply display and PDF improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          write('app/src/main/java/com/majortomman/school/data/DisplayPreferences.kt', r'''package com.majortomman.school.data

import android.content.Context
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow

/**
 * UI display preferences shared by the whole application.
 * Text scale affects every Compose sp value through SchoolTheme's LocalDensity provider.
 */
data class DisplaySettings(
    val textScale: Float = DEFAULT_TEXT_SCALE,
) {
    companion object {
        const val DEFAULT_TEXT_SCALE = 1f
        const val MIN_TEXT_SCALE = 0.90f
        const val MAX_TEXT_SCALE = 1.50f

        fun normalize(value: Float): Float = value.coerceIn(MIN_TEXT_SCALE, MAX_TEXT_SCALE)
    }
}

object DisplayPreferences {
    private const val PREFERENCES_NAME = "school_display"
    private const val KEY_TEXT_SCALE = "text_scale"

    private val mutableState = MutableStateFlow(DisplaySettings())
    val state: StateFlow<DisplaySettings> = mutableState.asStateFlow()

    @Volatile
    private var initialized = false

    fun initialize(context: Context) {
        if (initialized) return
        synchronized(this) {
            if (initialized) return
            val preferences = context.applicationContext.getSharedPreferences(PREFERENCES_NAME, Context.MODE_PRIVATE)
            mutableState.value = DisplaySettings(
                textScale = DisplaySettings.normalize(
                    preferences.getFloat(KEY_TEXT_SCALE, DisplaySettings.DEFAULT_TEXT_SCALE),
                ),
            )
            initialized = true
        }
    }

    fun setTextScale(context: Context, scale: Float) {
        initialize(context)
        val normalized = DisplaySettings.normalize(scale)
        context.applicationContext
            .getSharedPreferences(PREFERENCES_NAME, Context.MODE_PRIVATE)
            .edit()
            .putFloat(KEY_TEXT_SCALE, normalized)
            .apply()
        mutableState.value = mutableState.value.copy(textScale = normalized)
    }
}
''')

          write('app/src/main/java/com/majortomman/school/ui/ZoomableMathCanvas.kt', r'''package com.majortomman.school.ui

import androidx.compose.foundation.Canvas
import androidx.compose.foundation.gestures.detectTapGestures
import androidx.compose.foundation.gestures.rememberTransformableState
import androidx.compose.foundation.gestures.transformable
import androidx.compose.foundation.layout.Box
import androidx.compose.foundation.layout.fillMaxSize
import androidx.compose.runtime.Composable
import androidx.compose.runtime.LaunchedEffect
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableFloatStateOf
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Modifier
import androidx.compose.ui.draw.clipToBounds
import androidx.compose.ui.geometry.Offset
import androidx.compose.ui.graphics.TransformOrigin
import androidx.compose.ui.graphics.drawscope.DrawScope
import androidx.compose.ui.graphics.graphicsLayer
import androidx.compose.ui.input.pointer.pointerInput
import androidx.compose.ui.layout.onSizeChanged
import androidx.compose.ui.unit.IntSize

/**
 * Shared zoom/pan surface for mathematical visualizations.
 * Pinch zooms, one-finger drag pans while zoomed, and double tap resets or zooms to 2x.
 */
@Composable
internal fun ZoomableMathCanvas(
    modifier: Modifier = Modifier,
    minScale: Float = 1f,
    maxScale: Float = 3.5f,
    content: DrawScope.() -> Unit,
) {
    var scale by remember { mutableFloatStateOf(minScale) }
    var offset by remember { mutableStateOf(Offset.Zero) }
    var viewport by remember { mutableStateOf(IntSize.Zero) }

    fun constrained(nextScale: Float, nextOffset: Offset): Offset {
        val maxX = viewport.width * (nextScale - 1f) / 2f
        val maxY = viewport.height * (nextScale - 1f) / 2f
        return Offset(
            x = nextOffset.x.coerceIn(-maxX, maxX),
            y = nextOffset.y.coerceIn(-maxY, maxY),
        )
    }

    val transformState = rememberTransformableState { zoomChange, panChange, _ ->
        val nextScale = (scale * zoomChange).coerceIn(minScale, maxScale)
        offset = if (nextScale <= minScale + 0.001f) {
            Offset.Zero
        } else {
            constrained(nextScale, offset + panChange)
        }
        scale = nextScale
    }

    LaunchedEffect(viewport, scale) {
        offset = constrained(scale, offset)
    }

    Box(
        modifier = modifier
            .clipToBounds()
            .onSizeChanged { viewport = it }
            .pointerInput(minScale, maxScale) {
                detectTapGestures(
                    onDoubleTap = {
                        if (scale > minScale + 0.05f) {
                            scale = minScale
                            offset = Offset.Zero
                        } else {
                            scale = 2f.coerceAtMost(maxScale)
                            offset = Offset.Zero
                        }
                    },
                )
            }
            .transformable(transformState),
    ) {
        Canvas(
            modifier = Modifier
                .fillMaxSize()
                .graphicsLayer {
                    scaleX = scale
                    scaleY = scale
                    translationX = offset.x
                    translationY = offset.y
                    transformOrigin = TransformOrigin.Center
                },
            onDraw = content,
        )
    }
}
''')


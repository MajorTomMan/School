name: Agent refactor visual and PDF layout

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-refactor-visual-pdf.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Refactor layouts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          opposite = Path('app/src/main/java/com/majortomman/school/ui/OppositeQuantitiesSceneVisual.kt')
          text = opposite.read_text(encoding='utf-8')
          start_marker = '''        Row(
              modifier = Modifier.fillMaxWidth(),
              horizontalArrangement = Arrangement.SpaceBetween,
              verticalAlignment = Alignment.CenterVertically,
          ) {'''.replace('              ', '            ')
          end_marker = '\n\n        Slider('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'opposite layout markers not found: start={start}, end={end}')
          replacement = '''        val baselineText = when (selectedScene.id) {
              "tolerance" -> "标准直径 40.00 mm"
              "elevation" -> "海平面为 0 m"
              else -> "以 0 为基准"
          }
          val usesHorizontalAxis = selectedScene.id !in setOf("temperature", "elevation", "tolerance")
          if (usesHorizontalAxis) {
              OppositeQuantityAxisPanel(
                  baselineText = baselineText,
                  value = animatedValue,
                  bound = selectedScene.bound,
                  negativeMeaning = selectedScene.negativeMeaning,
                  positiveMeaning = selectedScene.positiveMeaning,
                  unit = selectedScene.unit,
              )
          } else {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Text(
                      text = baselineText,
                      color = InteractiveMuted,
                      fontSize = 12.sp,
                  )
                  Text(
                      text = displaySignedQuantity(animatedValue, selectedScene.unit),
                      color = valueColor(animatedValue),
                      fontSize = 18.sp,
                      fontWeight = FontWeight.SemiBold,
                  )
              }

              ZoomableMathCanvas(Modifier.fillMaxWidth().weight(1f)) {
                  when (selectedScene.id) {
                      "temperature" -> drawTemperatureScene(animatedValue)
                      "elevation" -> drawElevationScene(animatedValue, selectedScene.bound)
                      "tolerance" -> drawToleranceScene(animatedValue)
                  }
              }
          }'''.replace('          ', '        ', 1)
          text = text[:start] + replacement + text[end:]
          opposite.write_text(text, encoding='utf-8')

          pdf = Path('app/src/main/java/com/majortomman/school/ui/PdfTextbookScreen.kt')
          text = pdf.read_text(encoding='utf-8')
          import_marker = 'import androidx.compose.foundation.layout.systemBarsPadding\n'
          if 'import androidx.compose.foundation.shape.RoundedCornerShape\n' not in text:
              text = text.replace(import_marker, import_marker + 'import androidx.compose.foundation.shape.RoundedCornerShape\n', 1)
          start_marker = '    Column(Modifier.fillMaxSize().background(ReaderBlack).systemBarsPadding()) {\n'
          start = text.find(start_marker)
          body_start = start + len(start_marker)
          end_marker = '\n\n        BoxWithConstraints'
          end = text.find(end_marker, body_start)
          if start < 0 or end < 0:
              raise SystemExit(f'pdf header markers not found: start={start}, end={end}')
          header = '''        Column(
              modifier = Modifier
                  .fillMaxWidth()
                  .padding(horizontal = 22.dp, vertical = 14.dp),
              verticalArrangement = Arrangement.spacedBy(7.dp),
          ) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Text(
                      if (activeWindow == null) "教材" else "本节教材",
                      color = ReaderYellow,
                      fontSize = 13.sp,
                      fontWeight = FontWeight.Bold,
                  )
                  PdfReaderStatus(
                      printedPage = printedPage,
                      zoomPercent = (zoom * 100).roundToInt(),
                  )
              }
              Text(
                  pack.manifest.title,
                  modifier = Modifier.fillMaxWidth(),
                  color = ReaderWhite,
                  fontSize = 20.sp,
                  lineHeight = 27.sp,
                  fontWeight = FontWeight.Medium,
              )
              activeWindow?.let { range ->
                  Text(
                      "只查看第 ${range.startPrintedPage}—${range.endPrintedPage} 页",
                      color = ReaderBlue,
                      fontSize = 12.sp,
                  )
              }
          }'''
          text = text[:body_start] + header + text[end:]
          function_marker = '\n@Composable\nprivate fun ReaderAction('
          status_function = '''

@Composable
private fun PdfReaderStatus(
    printedPage: Int,
    zoomPercent: Int,
) {
    Box(
        modifier = Modifier
            .background(ReaderWhite.copy(alpha = 0.07f), RoundedCornerShape(12.dp))
            .padding(horizontal = 11.dp, vertical = 7.dp),
        contentAlignment = Alignment.Center,
    ) {
        Text(
            text = "第 $printedPage 页 · $zoomPercent%",
            color = ReaderMuted,
            fontSize = 12.sp,
            fontWeight = FontWeight.Medium,
            maxLines = 1,
            softWrap = false,
        )
    }
}
'''
          if function_marker not in text:
              raise SystemExit('ReaderAction marker not found')
          text = text.replace(function_marker, status_function + function_marker, 1)
          pdf.write_text(text, encoding='utf-8')
          PY
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui/OppositeQuantitiesSceneVisual.kt \
                  app/src/main/java/com/majortomman/school/ui/PdfTextbookScreen.kt
          git commit -m "重构相对基准可视化并修复PDF状态布局"
          git push origin HEAD:dev

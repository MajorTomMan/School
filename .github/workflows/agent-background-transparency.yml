name: Agent background transparency

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/agent-background-transparency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Expose configured app background
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/com/majortomman/school/ui')
          changed = []
          for path in root.glob('*.kt'):
              if path.name == 'PdfTextbookScreen.kt':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('private val NavigationBlack = Color.Black', 'private val NavigationBlack = Color.Transparent')
              updated = updated.replace('private val SettingsBlack = Color(0xFF050608)', 'private val SettingsBlack = Color.Transparent')
              updated = updated.replace('private val ScreenBlack = Color(0xFF050608)', 'private val ScreenBlack = Color.Transparent')
              updated = updated.replace('private val SceneBlack = Color(0xFF050608)', 'private val SceneBlack = Color.Transparent')
              updated = updated.replace('private val ReviewBlack = Color(0xFF050608)', 'private val ReviewBlack = Color.Transparent')
              updated = updated.replace('private val BankBlack = Color(0xFF050608)', 'private val BankBlack = Color.Transparent')
              updated = updated.replace('private val PathBlack = Color(0xFF050608)', 'private val PathBlack = Color.Transparent')
              updated = updated.replace('private val SubjectBlack = Color(0xFF050608)', 'private val SubjectBlack = Color.Transparent')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No background constants changed')
          print('\n'.join(changed))
          PY
      - name: Commit background transparency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/majortomman/school/ui
          git commit -m "让主要页面显示可配置背景"
          git push origin HEAD:dev
